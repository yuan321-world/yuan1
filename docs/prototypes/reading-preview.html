<script id="reading-data" type="application/json">[{"categoryId":"1","title":"A Notebook That Makes Room for Tomorrow","titleZh":"给明天留一页笔记","summary":"A student changes a crowded study notebook into a small, useful daily habit.","difficulty":"B1","body":"On Monday evening, Mina opened her English notebook and felt tired before she had written a word. Every page contained long lists copied from a textbook. Some words had bright circles around them, but she could not remember why. The notebook showed how much time she had spent copying. It did not show what she could actually use. She decided to try a smaller habit for one week.\n\nInstead of adding twenty new words, Mina chose three words from a short article. She wrote each word beside the sentence where she had found it. Under the sentence, she added one example about her own day. For the word \"return,\" she wrote about returning a library book. The example was ordinary, but that was the point. It connected a piece of English with something she already understood.\n\nThe next morning, Mina covered the explanations and tried to recall the meanings. One word came back easily. Another needed a little thought. She could not remember the third at all. Rather than copying the whole page again, she checked that word and said its example aloud. This short review gave her a clearer task than simply reading the same list from top to bottom.\n\nBy Thursday, the routine had met its first difficulty. Mina came home late and did not want to study. She reduced the task to one sentence from the previous day. It took only a few minutes, and she left a small note about what was still unclear. She did not call the evening a perfect success. She also did not treat it as a reason to abandon the notebook.\n\nOn Sunday, Mina compared her new pages with the older lists. The new section looked less impressive from a distance. It contained fewer words and more empty space. However, she could explain several examples without looking at the Chinese notes. She could also see exactly which words needed another review. The notebook had become a record of questions and useful attempts, rather than a display of completed pages.\n\nMina kept the empty space at the bottom of each page for tomorrow. She used it for a new example, a correction, or a connection to another article. Her method was still an experiment, and she planned to adjust it. For now, the small notebook gave her a simple place to begin again.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"1","title":"The Question at the Back of the Classroom","titleZh":"教室后排的一个问题","summary":"A quiet learner discovers how a specific question can turn uncertainty into a shared discussion.","difficulty":"B2","body":"During a reading class, Leo noticed that everyone around him was turning the page. He was still looking at a single paragraph. The writer seemed to support an idea in the first sentence and challenge it in the next. Leo understood most of the vocabulary, yet he could not explain how the two sentences fitted together. He wondered whether asking a question would show that he had fallen behind.\n\nAt the end of the lesson, the teacher invited questions. Leo almost remained silent. Then he read his note: \"What does the word 'however' change here?\" It was a small question about a visible detail. The teacher asked him to describe his current understanding before offering an answer. Leo explained that he had treated both sentences as the writer's own opinion. Saying this aloud made the source of his confusion easier to find.\n\nAnother student pointed to a phrase that introduced a different person's argument. Together, the class marked which ideas belonged to whom. The paragraph had not changed, but their picture of it had. The teacher described this process as looking for evidence in the text. A reasonable answer needed more than a confident voice. It needed words or structures that other readers could check for themselves.\n\nAfter class, Leo expected his classmates to forget the discussion. Instead, one student thanked him. She had also been unsure but had assumed that everyone else understood. They agreed to compare one difficult paragraph before the next lesson. Their aim was not to decide who was the better reader. They wanted to notice where their explanations differed and return to the article with a more specific purpose.\n\nLeo began keeping a short list of questions. He avoided writing only \"I don't understand.\" Instead, he recorded what he understood, the point where that explanation stopped working, and one possible alternative. Sometimes the answer came during this preparation. At other times, a classmate or teacher helped. His confidence grew from having a way to investigate uncertainty, rather than from pretending uncertainty had disappeared.\n\nThe following week, Leo asked another question from the back of the classroom. This time, he was prepared to change his view if someone showed stronger evidence. He still spoke quietly. What had changed was his expectation of the conversation: a useful question could help several people move forward, even when its answer was not immediate.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"2","title":"Saturday at the Repair Table","titleZh":"周六的修理桌","summary":"Neighbors use a shared repair table to exchange practical skills and rethink familiar objects.","difficulty":"B1","body":"At the entrance to a neighborhood center, someone placed a handwritten sign beside a wooden table. It said, \"Bring one broken thing and one question.\" On Saturday morning, Jun arrived with a desk lamp that no longer worked. He expected to leave it with an expert and collect it later. Instead, a volunteer offered him a chair and asked him to describe what had happened before the lamp stopped working.\n\nThe repair table was not a shop. It was a small community activity where people could learn from one another. A retired technician checked the lamp after explaining the safety rules. Jun watched from the other side of the table and wrote down the parts he could recognize. Tasks involving electrical risks stayed with the trained volunteer. Participation did not mean that every visitor should attempt every kind of repair.\n\nAt the next table, a student was sewing a loose button onto a coat. Another visitor helped someone adjust a bicycle seat. People shared simple tools and talked while they waited. A notice explained which tools they could borrow and when to return them. The organizers had learned that a shared collection needed clear labels and a record of who was using each item. Good intentions alone did not keep the tools available.\n\nNot every object could be repaired that morning. One radio needed a part that nobody had. Its owner received a written description of the problem, not a promise that it would certainly work again. Another visitor decided that a damaged chair was beyond the group's ability. The volunteer explained the limits of the activity and suggested asking a suitable professional. Knowing when to stop was part of using the table responsibly.\n\nJun's lamp needed a replacement switch. While the volunteer completed the work, Jun helped sort the small storage boxes. He had arrived thinking only about a broken object. He left with a better understanding of the lamp and the people living nearby. On the way home, he noticed a loose strap on his bag and decided to bring a different question next time.\n\nThe following Saturday, Jun returned without anything broken. He carried a notebook and asked how he could help welcome new visitors. The repair table had become more than a place to save an object. It offered a regular reason for neighbors to meet, exchange knowledge, and make careful choices together.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"2","title":"A Different Route Home","titleZh":"换一条回家的路","summary":"A short walk helps a busy student notice her neighborhood and set a practical boundary around screen time.","difficulty":"B1","body":"Nora usually travelled home by the same bus. After class, she would sit near the back and look at her phone until her stop appeared. One afternoon, a road closure changed the journey. The bus stopped two streets away from her building, and she had to walk the final part. At first, she felt annoyed. Then she noticed a small garden behind a low wall that she had never seen before.\n\nThe next day, Nora chose to leave the bus at the same place. She was not beginning an ambitious exercise plan. She simply wanted ten minutes without another screen. Before walking, she checked the route and put her phone in her bag. She kept it available for directions or an important call. The aim was to give her attention a different task, not to prove that she could live without technology.\n\nDuring the first few walks, Nora tried a simple activity. She looked for one detail that was different from the previous day. A shop had changed its window display. A worker had painted a gate. Rain had filled a small space beside the road. These details did not need to be beautiful or interesting to anyone else. Looking for them gave her a reason to notice where she actually was.\n\nSome evenings, the route did not suit her. Heavy rain made the bus a more comfortable choice. When she needed to return quickly, she went straight home. Nora decided that a useful routine should respond to real conditions. She did not want a quiet walk to become another task that made her feel guilty. The decision to walk could be small and flexible while still having a place in her week.\n\nAfter a month, Nora could describe several streets that had once been only names on a map. She sometimes bought fruit from a shop on the corner and exchanged greetings with its owner. She also noticed when she reached for her phone without a particular reason. Rather than judging every moment of screen use, she began asking what she wanted from it at that moment.\n\nFor Nora, balance did not mean dividing every hour into equal parts. It meant choosing when a device was useful and when another experience deserved attention. The garden behind the wall had always been there. A different route had simply given her enough space to see it.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"3","title":"Before You Press Allow","titleZh":"点击允许之前","summary":"A student team compares an app's attractive features with the permissions it requests.","difficulty":"B2","body":"When a student team tested a new planning app, the first screen looked promising. It offered shared task lists, colorful reminders, and a quick way to arrange meetings. Most of the group wanted to create accounts immediately. Sara paused at a request for access to her contact list. She could understand why a meeting tool might need names, but she was not sure why it needed every contact on her phone.\n\nThe team decided to spend part of the meeting examining the request. They listed what they wanted the app to do and what information each feature appeared to require. A personal reminder needed a task and a time. Inviting a classmate might need one address. These observations did not prove that the app was unsafe. They gave the students specific questions to investigate before making a choice about permission.\n\nSara opened the explanation beside the request. It described a feature that suggested people to invite. The group then checked whether that feature could be disabled. They found a way to add classmates manually instead. This alternative required more effort at the beginning, but it matched their immediate purpose. They did not need to accept every available feature in order to use a shared list.\n\nAnother student suggested reading online comments. The team treated those comments as personal experiences, not complete evidence about how the service worked. They compared the comments with the app's own instructions and privacy information. When a claim remained unclear, they wrote it down rather than turning a guess into a fact. To verify a detail, they needed a source that actually addressed the question being asked.\n\nAt the end of the meeting, the students chose a limited trial using ordinary practice tasks. They agreed not to put sensitive information into the list. They also checked how to remove an account and what the service said about stored records. Their choice could change later if the app's behavior, settings, or their needs changed. The decision was part of an ongoing process, not a permanent judgment about every digital tool.\n\nThe exercise made privacy less abstract for the team. It connected a broad idea with a particular request on a familiar screen. Before pressing \"Allow,\" they had learned to ask what a feature needed, what alternatives existed, and whether the explanation was clear enough for the choice in front of them.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"3","title":"Choosing a Journey, Not Just a Vehicle","titleZh":"选择一段行程，而不只是一辆车","summary":"Students compare everyday travel options by considering the whole journey and their changing needs.","difficulty":"B2","body":"In a campus design class, a group of students received a simple question: what would make the journey from a station to their classroom easier? Their first answer was a new electric vehicle. It sounded modern and efficient, and several students began drawing before they had examined the journey itself. Their tutor asked them to put the drawings aside and travel the route using the options already available.\n\nThe students divided into pairs. One pair walked, another used a bus, and a third tried the campus bicycle service. They recorded waiting time, places to leave a bicycle, and the distance from each stop to the classroom. They also noted whether a route was practical when someone carried a large bag or needed step-free access. A useful comparison had to include more than the time spent moving.\n\nWhen they returned, the group discussed energy as one part of a larger system. An electric vehicle needed a charged battery, a suitable place to charge it, and regular care. A bus needed a route and a schedule that matched people's journeys. Walking required a connected path that people could reasonably use. The class did not calculate a complete environmental comparison, because they did not have the necessary data. They marked that limit clearly.\n\nThe observations changed their design idea. They noticed that many visitors lost time looking for the correct exit at the station. Clearer signs and a simple route map might help those visitors without adding another vehicle. For people who could not comfortably use that path, information about the existing accessible bus stop was difficult to find. Improving that information became a second part of the proposal.\n\nThe students kept a separate list of questions about a possible electric service. How many people would use it? Where could it wait without blocking the entrance? Who would maintain the equipment? What would happen when a battery needed charging during a busy period? The group did not treat these questions as arguments against technology. They were conditions that any practical design would need to address.\n\nTheir final presentation contained fewer drawings of vehicles and more details about people and places. The word \"efficient\" now described whether a whole journey worked well for a particular need. The students had started by choosing a machine. They finished by explaining a problem, proposing a small improvement, and showing what they still needed to learn.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"4","title":"The Recipe with Three Different Endings","titleZh":"一道食谱的三种结尾","summary":"A family cooking afternoon shows how a tradition can remain recognizable while making room for different people.","difficulty":"B1","body":"On the morning of a neighborhood festival, Mei found three versions of the same recipe on her kitchen table. Her grandmother had written one on an old card. Her uncle had sent another in a message. The third was Mei's own note from the previous year. Each version described a familiar family dish, but the final instructions were different. Mei wondered which one she should call the correct recipe.\n\nHer grandmother laughed when she saw the three pages. She explained that the old card was already different from the version she had learned as a child. At that time, some ingredients had been difficult to find. Later, she had changed the amount she prepared because the family had become smaller. What Mei thought of as a fixed tradition had developed through ordinary choices made in different kitchens.\n\nThat afternoon, the family decided to cook together. They discussed which parts gave the dish its familiar character and which parts could change. A cousin could not eat one ingredient, so they prepared a separate portion with a suitable alternative. Mei wrote the difference on a label rather than hiding it. Welcoming someone to the table mattered more than making every plate look exactly the same.\n\nWhile they worked, Mei asked about the memory behind the dish. Her uncle remembered carrying it to a relative's home in a covered bowl. Her grandmother remembered a crowded kitchen and someone who always arrived late. These stories did not produce one official history. They showed how the same food could connect people with different moments. Mei recorded each story beside the name of the person who had told it.\n\nAt the festival, a visitor asked for the recipe. Mei offered a copy of the basic method with three possible endings. She included the ingredients in each version and explained that families could make their own choices. She did not present the dish as a complete picture of a whole culture. It was one family's practice, shared with care and enough information for someone else to understand it.\n\nThat evening, Mei added a fourth page to the collection. It described the afternoon, including the separate portion and the visitor's question. The tradition had not disappeared because the recipe had changed. For Mei, it had become easier to recognize: a familiar activity that people could carry forward while making room for the lives they actually lived.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"4","title":"A Library Card and an Empty Chair","titleZh":"一张借书卡与一把空椅子","summary":"A new visitor learns how a public library serves different needs through shared space and clear rules.","difficulty":"B1","body":"When Omar moved to a new town, he visited the public library to find a place to read. He expected shelves, a desk, and perhaps a few newspapers. Near the entrance, however, he saw a notice about a conversation group. Another notice described a quiet study room. There was also a small display of objects that residents could borrow. Omar realized that he did not yet understand all the ways the building was used.\n\nA volunteer welcomed him and explained the library card application. Omar asked which services required a card and which spaces he could use without one. The volunteer showed him the current rules instead of assuming that every service worked in the same way. Clear information made access easier. Omar could choose where to begin without feeling that he should already know how the library operated.\n\nDuring his first week, Omar used an empty chair near a window. Some visitors came to study, while others searched for practical information or read with their children. These activities did not always fit comfortably together. A lively conversation could disturb someone preparing for an examination. The library used separate areas and visible signs to explain where different activities belonged. Sharing a space required attention to other people's needs as well as one's own.\n\nOn Wednesday, Omar joined the conversation group. The topic was a place that participants liked in town. Nobody had to give a perfect speech. Each person could speak, ask a question, or simply listen. The volunteer helped people take turns and checked unfamiliar words when necessary. Omar described the window seat. Another participant recommended a nearby garden, and a third asked where the quiet study room was.\n\nLater, Omar noticed that some instructions were difficult for a new visitor to find. He asked whether he could help test a simpler map of the building. The librarian welcomed the suggestion but explained that changes needed to be checked for accuracy and accessibility. Omar joined a small group that walked through the entrance as if arriving for the first time. They recorded questions rather than guessing what every visitor would need.\n\nOmar still used the chair near the window, but it no longer felt like an isolated place. His library card gave him access to a collection. Returning regularly gave him a chance to understand the people and arrangements that made the shared space work.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"5","title":"The Note That Helped the Next Shift","titleZh":"帮助下一班同事的一份记录","summary":"A team replaces a vague handoff with a short record of decisions, open questions, and responsibility.","difficulty":"B2","body":"At a small design studio, the evening shift often left a message saying, \"Everything is nearly ready.\" The next morning, colleagues still needed to ask which files were current, what had been checked, and whether anyone was waiting for an answer. The message sounded positive, but it did not help them decide what to do next. When a deadline approached, these missing details became especially difficult to manage.\n\nThe team decided to examine one handoff rather than introduce a complicated new system. They chose a poster project that would pass between two shifts. Before leaving, the evening team wrote three short sections: what was finished, what remained uncertain, and who was responsible for the next action. They linked the current file and described the checks already completed. They also named an older version that should no longer be used.\n\nIn the morning, a colleague found a question about a photograph. The note did not simply say that the image was \"probably fine.\" It stated which permission information had been received and which detail still needed confirmation. The colleague could continue with another part of the project while the responsible person investigated. Making uncertainty visible allowed the next shift to work around it instead of discovering the same problem again.\n\nThe first handoff note was longer than anyone wanted. During a short review, the team removed details that did not affect the next person's choices. They kept the file location, the decision, the reason for an important change, and the next action. A useful record did not need to repeat every conversation. It needed enough context for someone who had not been present to continue the work responsibly.\n\nThey also discussed responsibility. Naming a person in the note was not a way to assign blame if something went wrong. It showed who could answer a question or make the next decision. When a person was unavailable, the note identified an alternative contact. The team agreed that important changes to a deadline or expected result should be confirmed directly, rather than hidden inside a long message that someone might miss.\n\nAfter the project, the studio kept the three sections for similar tasks. The notes did not remove the need for conversation. They made conversations more specific and reduced repeated searches for basic information. The best sign of progress was ordinary: the next shift could open the right file, understand the remaining question, and begin its work.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"},{"categoryId":"5","title":"A Meeting with Time to Think","titleZh":"留出思考时间的会议","summary":"A group changes its meeting routine so useful contributions can arrive in more than one way.","difficulty":"B2","body":"Before a student organization planned its annual event, its committee met in a crowded room. The same two people usually spoke first, and their ideas often shaped the whole discussion. Quieter members sometimes sent useful suggestions afterward, when the main decision had already been made. The chairperson wanted more balanced participation, but asking everyone to \"speak more\" did not explain how the meeting could support different ways of thinking.\n\nFor the next meeting, the chairperson shared a short agenda in advance. Each topic included a question and the decision the group hoped to make. Members could read the material beforehand and send notes if they wished. The agenda did not assume that everyone had unlimited preparation time. It highlighted one essential page and separated background information from the details needed for a decision that evening.\n\nAt the beginning of the meeting, the group spent a few quiet minutes writing ideas. Nobody needed to produce a complete proposal immediately. Members then compared notes in pairs before the wider discussion. This arrangement did not make every contribution equally useful, but it gave more people a clear point at which to begin. One member noticed a practical access problem that earlier conversations had overlooked.\n\nThe chairperson also changed the questions used during discussion. Instead of asking whether an idea was \"good,\" she asked what problem it solved, what resources it required, and what information was still missing. Members could disagree with a proposal while showing respect for the person who suggested it. They were encouraged to explain their reasons and to change their position when another contribution addressed a concern more effectively.\n\nAt the end, someone read a short summary aloud. It listed the decisions, the people responsible for the next actions, and the questions that remained open. Members checked whether the summary represented what they had actually agreed. A suggestion was not recorded as a decision simply because it had been mentioned confidently. The group also set a suitable time to review the unresolved points.\n\nThe new routine required practice. Some meetings still ran too long, and the committee continued adjusting the agenda. Yet more of the useful thinking now appeared before a choice was final. The chairperson learned that participation was not only a matter of who spoke the most. It also depended on how people received information, prepared a response, and understood what would happen next.","author":"Lingua Loop Editorial Team","sourceType":"ORIGINAL","sourceUrl":null,"usageNote":"Lingua Loop原创英语学习练习；情境为虚构示例。B1/B2为编辑难度标注，非官方评级、真题或媒体转载。"}]</script>

<script>
const $=s=>document.querySelector(s),icon=name=>'<svg aria-hidden="true"><use href="#'+name+'"/></svg>',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups={'1':'学习','2':'生活','3':'科技','4':'文化','5':'职场'},articles=JSON.parse($('#reading-data').textContent),dictionary=JSON.parse($('#dictionary-data').textContent);
let signedIn=false,tab='all',category='',page=1,keyword='',selected=null,fontSize=20,lineHeight=1.9,pending=null,opener=null,selectionWord='',savedWords=new Set(),favorites=new Set(),history=new Map();
const PAGE_SIZE=6;
const token=/[A-Za-z]+(?:['’‐‑-][A-Za-z]+)*/g;
articles.forEach((a,i)=>{a.id=i+1;a.words=(a.body.match(token)||[]).length;a.minutes=Math.max(1,Math.ceil(a.words/200))});
let featuredId=articles.length?Math.floor(Date.now()/86400000)%articles.length+1:0;
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3200)}
function closeMenu(){$('#navigation').classList.remove('is-open');$('#menu-toggle').setAttribute('aria-expanded','false')}
$('#menu-toggle').onclick=()=>{const open=$('#navigation').classList.toggle('is-open');$('#menu-toggle').setAttribute('aria-expanded',String(open))};
$('#navigation').addEventListener('click',closeMenu);
$('#brand').onclick=$('#reading-nav').onclick=e=>{e.preventDefault();showList()};
document.querySelectorAll('[data-placeholder]').forEach(button=>button.addEventListener('click',e=>{e.preventDefault();toast(button.dataset.placeholder+'入口保留；本原型仅预览阅读模块。')}));
function renderCategories(){$('#categories').innerHTML=[['','全部主题'],...Object.entries(groups)].map(([id,name])=>'<button class="category" type="button" data-category="'+id+'" aria-pressed="'+(category===id)+'">'+name+'</button>').join('')+'<button type="button" class="text-button clear" id="clear-filters">清空筛选</button>';$('#categories').querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{category=button.dataset.category;page=1;render()});$('#clear-filters').onclick=()=>{category='';keyword='';$('#search').value='';$('#difficulty').value='';$('#sort').value='newest';page=1;render()}}
function bookmarkButton(a){return '<button class="bookmark" data-favorite="'+a.id+'" aria-pressed="'+(signedIn&&favorites.has(a.id))+'" aria-label="'+(signedIn&&favorites.has(a.id)?'取消收藏':'收藏文章')+'：'+esc(a.title)+'">'+icon('bookmark')+'</button>'}
function renderFeatured(){const a=articles.find(a=>a.id===featuredId);if(!a){$('#featured').hidden=true;return}$('#featured').hidden=false;$('#featured').innerHTML='<div><div class="featured-label">'+icon('book')+'每日精选 <span>从一篇开始</span></div><h2>'+esc(a.title)+'</h2><p class="zh">'+esc(a.titleZh)+'</p><div class="meta">'+groups[a.categoryId]+' &nbsp;·&nbsp; '+a.difficulty+' &nbsp;·&nbsp; '+a.words+' 词 &nbsp;·&nbsp; 约 '+a.minutes+' 分钟</div></div><div class="featured-right"><p>'+esc(a.summary)+'</p><button class="button dark" data-read="'+a.id+'">读这一篇 '+icon('arrow')+'</button></div>'}
function filtered(){let list=articles.filter(a=>(!category||a.categoryId===category)&&(!$('#difficulty').value||a.difficulty===$('#difficulty').value)&&(!keyword||(a.title+' '+a.titleZh+' '+a.summary).toLowerCase().includes(keyword.toLowerCase()))&&(tab==='all'||(signedIn&&(tab==='favorites'?favorites.has(a.id):history.has(a.id)))));const sort=$('#sort').value;list.sort((a,b)=>tab==='history'?history.get(b.id).time-history.get(a.id).time:sort==='short'?a.words-b.words:sort==='long'?b.words-a.words:b.id-a.id);return list}
function render(){renderCategories();renderFeatured();document.querySelectorAll('[data-tab]').forEach(button=>{button.setAttribute('aria-selected',String(tab===button.dataset.tab));button.tabIndex=tab===button.dataset.tab?0:-1});$('#article-panel').setAttribute('aria-labelledby','tab-'+tab);
 const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.min(page,pages);$('#list-count').textContent=(tab==='all'?'共 ':'')+list.length+' 篇';
 if(!signedIn&&tab!=='all'){$('#cards').className='';$('#cards').innerHTML='<div class="empty">'+icon('bookmark')+'<h3>把阅读留在自己的账户里</h3><p>登录后查看'+(tab==='favorites'?'收藏的文章':'自己的阅读历史')+'。</p><button class="button dark" id="empty-login">登录后查看</button></div>';$('#empty-login').onclick=()=>login(()=>render(),tab==='favorites'?'查看我的收藏':'查看阅读历史');$('#pagination').innerHTML='';return}
 $('#cards').className=list.length?'card-grid':'';
 $('#cards').innerHTML=list.length?list.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE).map(a=>{const record=signedIn?history.get(a.id):null,state=record?.complete?'completed':record?'reading':'';return '<article class="article-card">'+bookmarkButton(a)+'<div class="card-top"><span class="category-tag">'+groups[a.categoryId]+'</span><span class="difficulty">'+a.difficulty+'</span></div><h3><button data-read="'+a.id+'">'+esc(a.title)+'</button></h3><p class="zh">'+esc(a.titleZh)+'</p><p class="summary" lang="en">'+esc(a.summary)+'</p><div class="card-meta"><span>Lingua Loop 原创</span><span class="dot">·</span><span>'+a.words+' 词</span><span class="dot">·</span><span>约 '+a.minutes+' 分钟</span></div><footer class="card-footer"><span class="status '+state+'"><i></i>'+(record?.complete?'已完成':record?'阅读中':'未开始')+'</span><button class="read-link" data-read="'+a.id+'">'+(record?.complete?'再次阅读':record?'继续阅读':'开始阅读')+icon('arrow')+'</button></footer>'+(tab==='history'?'<p class="history-time">最近阅读 · '+new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'}).format(record.time)+'</p>':'')+'</article>'}).join(''):'<div class="empty">'+icon(tab==='favorites'?'bookmark':'search-icon')+'<h3>'+(keyword||category||$('#difficulty').value?'没有找到匹配的文章':tab==='favorites'?'还没有收藏的文章':'还没有阅读记录')+'</h3><p>'+(keyword||category||$('#difficulty').value?'试试更简短的关键词，或清空筛选条件。':tab==='favorites'?'遇到想读的文章，点一下右上角的收藏图标。':'从一篇感兴趣的文章开始吧。')+'</p></div>';
 $('#pagination').innerHTML=pages>1?'<button aria-label="上一页" data-page="'+(page-1)+'" '+(page<=1?'disabled':'')+'>‹</button>'+Array.from({length:pages},(_,i)=>'<button data-page="'+(i+1)+'" class="'+(page===i+1?'current':'')+'" '+(page===i+1?'aria-current="page"':'')+'>'+(i+1)+'</button>').join('')+'<button aria-label="下一页" data-page="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>›</button><span>每页 '+PAGE_SIZE+' 篇</span>':'';
 bindArticles();$('#pagination').querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{page=Number(button.dataset.page);render();$('#filters').scrollIntoView({block:'center'})});
}
function bindArticles(){document.querySelectorAll('[data-read]').forEach(button=>button.onclick=()=>showArticle(Number(button.dataset.read)));document.querySelectorAll('[data-favorite]').forEach(button=>button.onclick=()=>favorite(Number(button.dataset.favorite)))}
function favorite(id){if(!signedIn){login(()=>favorite(id),'收藏这篇文章');return}if(favorites.has(id)){favorites.delete(id);toast('已取消收藏（本页演示）')}else{favorites.add(id);toast('已收藏文章（本页演示）')}if(selected)renderDetail();else render()}
$('#filters').onsubmit=e=>{e.preventDefault();keyword=$('#search').value.trim();page=1;render()};$('#difficulty').onchange=$('#sort').onchange=()=>{page=1;render()};
function setTab(value){tab=value;page=1;render()}
document.querySelectorAll('[data-tab]').forEach(button=>{button.onclick=()=>setTab(button.dataset.tab);button.onkeydown=event=>{const tabs=Array.from(document.querySelectorAll('[data-tab]'));let next;if(event.key==='ArrowRight')next=tabs[(tabs.indexOf(button)+1)%tabs.length];if(event.key==='ArrowLeft')next=tabs[(tabs.indexOf(button)+tabs.length-1)%tabs.length];if(event.key==='Home')next=tabs[0];if(event.key==='End')next=tabs.at(-1);if(next){event.preventDefault();setTab(next.dataset.tab);next.focus()}}});
function showList(){selected=null;$('#list-view').hidden=false;$('#detail-view').hidden=true;closeWord();render();window.scrollTo({top:0})}
function showArticle(id){selected=articles.find(a=>a.id===id);if(!selected)return;if(signedIn){const previous=history.get(id);history.set(id,{...previous,time:Date.now(),paragraph:previous?.paragraph||0,complete:previous?.complete||false})}$('#list-view').hidden=true;$('#detail-view').hidden=false;renderDetail();window.scrollTo({top:0});const record=signedIn?history.get(id):null;if(record?.paragraph)setTimeout(()=>document.getElementById('paragraph-'+record.paragraph)?.scrollIntoView({block:'start'}),0)}
function renderDetail(){const a=selected;if(!a)return;$('#detail-view').innerHTML='<button class="back" id="back">← 返回文章列表</button><article class="reader"><div class="reader-top"><span class="category-tag">'+groups[a.categoryId]+'</span><span class="difficulty">'+a.difficulty+'</span>'+bookmarkButton(a)+'</div><h1 lang="en">'+esc(a.title)+'</h1><p class="reader-zh">'+esc(a.titleZh)+'</p><div class="reader-meta"><span>'+esc(a.author)+'</span><span>'+a.words+' 词</span><span>约 '+a.minutes+' 分钟</span></div><p class="reader-source">Lingua Loop 原创练习 · 难度为编辑标注，非官方评级</p><div class="reader-tools"><span>选择一个完整单词，即可查询释义</span><div class="tool-group"><button id="smaller" aria-label="缩小字号">A−</button><button id="larger" aria-label="放大字号">A＋</button><select id="line-height" aria-label="阅读行距"><option value="1.9">舒适行距</option><option value="2.2">宽松行距</option></select></div></div>'+(!signedIn?'<p class="reader-notice">游客可阅读与查词；收藏文章、保存生词和阅读位置需要登录。</p>':'')+'<div class="article-body" id="article-body" lang="en" style="font-size:'+fontSize+'px;line-height:'+lineHeight+'">'+a.body.split(/\n\s*\n/).map((p,i)=>'<p id="paragraph-'+i+'" data-paragraph="'+i+'">'+esc(p)+'</p>').join('')+'</div><footer class="reader-end"><p>读完后，主动标记完成。<br>'+(signedIn?'本次阅读状态仅在原型页面内保留。':'游客阅读不会写入个人历史。')+'</p><button class="button dark" id="complete" '+(signedIn&&history.get(a.id)?.complete?'disabled':'')+'>'+(signedIn&&history.get(a.id)?.complete?'已完成阅读':'标记为已读')+'</button></footer></article>';
 $('#back').onclick=showList;bindArticles();$('#line-height').value=String(lineHeight);$('#line-height').onchange=()=>{lineHeight=Number($('#line-height').value);$('#article-body').style.lineHeight=lineHeight};$('#smaller').onclick=()=>resize(-1);$('#larger').onclick=()=>resize(1);$('#complete').onclick=()=>{if(!signedIn){login(()=>$('#complete').click(),'保存阅读完成状态');return}const r=history.get(a.id)||{paragraph:0};history.set(a.id,{...r,time:Date.now(),complete:true});renderDetail();toast('已标记完成（本页演示）')};
}
function resize(change){fontSize=Math.max(17,Math.min(25,fontSize+change));$('#article-body').style.fontSize=fontSize+'px'}
let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(!signedIn||!selected)return;let paragraph=0;document.querySelectorAll('[data-paragraph]').forEach(el=>{if(el.getBoundingClientRect().top<innerHeight*.5)paragraph=Number(el.dataset.paragraph)});const r=history.get(selected.id);if(r)history.set(selected.id,{...r,paragraph,time:Date.now()})},500)},{passive:true});
const dialog=$('#auth-dialog');function login(action=null,intent='继续学习'){pending=action;opener=document.activeElement;$('#auth-intent').textContent='登录后'+intent+'。';dialog.showModal();$('#page').inert=true;$('#page').setAttribute('aria-hidden','true');$('#username').focus()}
$('#login-trigger').onclick=()=>login();$('#auth-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{$('#page').inert=false;$('#page').removeAttribute('aria-hidden');pending=null;if(opener?.isConnected)opener.focus({preventScroll:true})});
$('#password-eye').onclick=()=>{const input=$('#password'),visible=input.type==='password';input.type=visible?'text':'password';$('#password-eye').innerHTML=icon(visible?'eye':'eye-off');$('#password-eye').setAttribute('aria-label',visible?'隐藏密码':'显示密码');$('#password-eye').setAttribute('aria-pressed',String(visible))};
$('#login-form').onsubmit=event=>{event.preventDefault();const action=pending;signedIn=true;$('#login-trigger').hidden=true;$('#user-wrap').hidden=false;$('#username-label').textContent=$('#username').value;$('#avatar').textContent=($('#username').value||'L').slice(0,1).toUpperCase();$('#password').value='';dialog.close();if(selected){history.set(selected.id,{paragraph:0,time:Date.now(),complete:false});renderDetail()}else render();if(action)action();else toast('已进入登录演示状态')};
$('#avatar').onclick=()=>{const menu=$('#user-menu');menu.hidden=!menu.hidden;$('#avatar').setAttribute('aria-expanded',String(!menu.hidden))};
$('#logout').onclick=()=>{signedIn=false;favorites=new Set();history=new Map();savedWords=new Set();tab='all';$('#user-wrap').hidden=true;$('#user-menu').hidden=true;$('#avatar').setAttribute('aria-expanded','false');$('#login-trigger').hidden=false;closeWord();if(selected)renderDetail();else render();toast('已退出演示，个人演示记录已清除')};
document.addEventListener('pointerdown',event=>{if(!$('#user-wrap').contains(event.target)){$('#user-menu').hidden=true;$('#avatar').setAttribute('aria-expanded','false')}});
function findWord(word){const text=word.toLowerCase();return dictionary.find(e=>e.lemma.toLowerCase()===text||e.forms?.some(f=>f.toLowerCase()===text))}
document.addEventListener('selectionchange',()=>{const selection=getSelection(),word=selection?.toString().trim()||'';const range=selection?.rangeCount?selection.getRangeAt(0):null;const inside=range?.startContainer.parentElement?.closest('#article-body');if(!selected||!inside||!range?.endContainer.parentElement?.closest('#article-body')||!/^[A-Za-z]+(?:['’‐‑-][A-Za-z]+)*$/.test(word)){$('#word-trigger').hidden=true;return}selectionWord=word;const rect=range.getBoundingClientRect(),button=$('#word-trigger');button.textContent='查询 '+word;button.hidden=false;button.style.left=Math.max(12,Math.min(innerWidth-190,rect.left))+'px';button.style.top=Math.max(12,Math.min(innerHeight-55,rect.bottom+9))+'px'});
let wordOpener=null;$('#word-trigger').onclick=()=>{wordOpener=document.activeElement;const word=selectionWord,entry=findWord(word);$('#word-trigger').hidden=true;$('#word-title').textContent=entry?.lemma||word;$('#word-content').innerHTML=entry?entry.senses.slice(0,3).map(s=>'<p><strong>'+esc(s.partOfSpeech||'')+'</strong> '+esc(s.definitionZh||'')+'</p><p class="muted" lang="en">'+esc(s.definitionEn||'')+'</p>').join('')+'<small>Lingua Loop 原创编辑释义 · 有限词典样例</small><button class="button dark" id="save-word">'+(savedWords.has(entry.lemma)?'已加入生词本':'加入生词本')+'</button>':'<p>本地词典暂未收录这个词。</p><small>当前样例支持有限的单词查询，不支持短语或整句翻译。</small>';$('#word-panel').hidden=false;$('#word-panel').focus({preventScroll:true});if(entry)$('#save-word').onclick=()=>{if(!signedIn){login(()=>saveWord(entry.lemma),'将这个词加入生词本');return}saveWord(entry.lemma)}};
function saveWord(lemma){savedWords.add(lemma);if($('#save-word'))$('#save-word').textContent='已加入生词本';toast('已保存生词（本页演示）')}
function closeWord(){$('#word-panel').hidden=true;$('#word-trigger').hidden=true;if(wordOpener?.isConnected)wordOpener.focus({preventScroll:true});wordOpener=null}
$('#word-close').onclick=closeWord;document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!dialog.open){if(!$('#word-panel').hidden)closeWord();else if(!$('#user-menu').hidden){$('#user-menu').hidden=true;$('#avatar').setAttribute('aria-expanded','false');$('#avatar').focus()}else{closeMenu();$('#menu-toggle').focus()}}});
render();
</script></body></html>
