<div id="toast" role="status" hidden></div>
<script>
const seed=[
 ['panorama','pænəˈrɑːmə','n. 全景；概述','The hill offers a wide panorama of the city.','从这座山上可以俯瞰城市的广阔全景。'],
 ['scenery','ˈsiːnəri','n. 风景；景色','We stopped to enjoy the mountain scenery.','我们停下来欣赏山间的景色。'],
 ['lawsuit','ˈlɔːsuːt','n. 诉讼；起诉','The two companies settled the lawsuit last month.','两家公司上个月就这起诉讼达成了和解。'],
 ['radical','ˈrædɪkəl','adj. 根本的；彻底的','The team proposed a radical change to the plan.','团队提出对计划作出根本性的调整。'],
 ['objection','əbˈdʒekʃən','n. 反对；异议','She raised an objection to the new rule.','她对这项新规定提出了异议。'],
 ['obsolete','ˈɒbsəliːt','adj. 过时的；淘汰的','New technology can make old equipment obsolete.','新技术可能使旧设备遭到淘汰。'],
 ['majority','məˈdʒɒrəti','n. 大多数；多数','The majority of students chose the morning class.','大多数学生选择了上午的课程。'],
 ['scale','skeɪl','n. 规模；刻度；v. 攀登','We did not realize the scale of the problem.','我们当时没有意识到这个问题的严重程度。'],
 ['approach','əˈprəʊtʃ','n. 方法；v. 接近','We need a different approach to this problem.','我们需要用不同的方法来处理这个问题。'],
 ['benefit','ˈbenɪfɪt','n. 益处；v. 受益','Regular exercise can benefit both body and mind.','经常锻炼能让身心都受益。'],
 ['achieve','əˈtʃiːv','v. 实现；达到','Small daily steps can help you achieve your goal.','每天的一点努力可以帮助你实现目标。'],
 ['support','səˈpɔːt','v. 支持；n. 帮助','Her family gave her the support she needed.','她的家人给予了她所需的支持。'],
 ['nature','ˈneɪtʃə','n. 自然；本性','Spending time in nature helps me relax.','在大自然中待一会儿有助于我放松。'],
 ['economic','ˌiːkəˈnɒmɪk','adj. 经济的','The report describes the economic changes in the region.','这份报告描述了该地区的经济变化。'],
 ['substantial','səbˈstænʃəl','adj. 大量的；实质性的','The new method led to a substantial improvement.','新方法带来了显著的改进。'],
 ['reliable','rɪˈlaɪəbəl','adj. 可靠的','We need reliable information before making a decision.','我们在作决定之前需要可靠的信息。'],
 ['transform','trænsˈfɔːm','v. 改变；转变','The project will transform an empty building into a library.','这个项目将把一栋闲置建筑改造成图书馆。'],
 ['evidence','ˈevɪdəns','n. 证据；依据','There is clear evidence that the method works.','有明确的证据表明这种方法有效。'],
 ['pursue','pəˈsjuː','v. 追求；继续从事','He moved to another city to pursue his studies.','他搬到另一个城市继续学业。'],
 ['maintain','meɪnˈteɪn','v. 保持；维护','It is important to maintain a regular sleep schedule.','保持规律的作息很重要。'],
 ['insight','ˈɪnsaɪt','n. 洞察；深刻理解','The interview gave us an insight into her work.','这次访谈让我们对她的工作有了深入了解。'],
 ['efficient','ɪˈfɪʃənt','adj. 高效的','A simple checklist can make your work more efficient.','一份简单的清单就能让你的工作更高效。'],
 ['opportunity','ˌɒpəˈtjuːnəti','n. 机会','The course gave her an opportunity to practise speaking.','这门课给了她练习口语的机会。'],
 ['challenge','ˈtʃælɪndʒ','n. 挑战；v. 质疑','Learning a new language is a rewarding challenge.','学习一门新语言是一项很有收获的挑战。']
];
const books=[{id:'postgraduate',title:'考研英语·乱序版',ids:seed.map(x=>x[0])},{id:'cet4',title:'大学英语四级·核心词汇版',ids:['nature','benefit','achieve','support','majority','scale','approach','economic','reliable','transform','evidence','pursue','maintain','efficient','opportunity','challenge']}];
const labels={all:'全部',new:'未学习',review:'复习中',mastered:'已熟练'};
const key='lingua-wordbook-list-prototype-v1';
function initial(){return{book:'postgraduate',tab:'all',query:'',studyBook:'postgraduate',collectedOnly:false,meaning:false,sort:'book',limit:12,scroll:0,words:Object.fromEntries(seed.map((w,i)=>[w[0],{state:['new','review','review','mastered','new','review'][i%6],due:i%3===1,collected:[0,4,8,11,15].includes(i),prior:null}]))}}
let state=initial();try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&books.some(b=>b.id===saved.book)&&saved.words&&seed.every(x=>saved.words[x[0]]&&['new','review','mastered','paused'].includes(saved.words[x[0]].state))){state={...state,...saved,words:saved.words};if(!labels[state.tab])state.tab='all';state.limit=Math.max(12,Math.min(24,Number(state.limit)||12));state.query=String(state.query||'').slice(0,80)}}catch{}
if(!books.some(b=>b.id===state.studyBook))state.studyBook=state.book;delete state.review;
delete state.difficultOnly;for(const word of Object.values(state.words)){if(word.state==='paused')word.state='review';if(word.prior==='paused')word.prior='review';delete word.difficult}
let selected=null,toastTimer,scrollTimer,voiceSequence=0;
const $=id=>document.getElementById(id);
const data=()=>books.find(b=>b.id===state.book).ids.map(id=>({id,info:seed.find(x=>x[0]===id),...state.words[id]}));
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function feedback(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300)}
function status(word){if(word.state==='new')return'未学习';if(word.state==='mastered')return'已熟练 · 免复习';return word.due?'今天到期':'3天后复习'}
function escape(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matching(){let list=data();const q=state.query.trim().toLowerCase();list=list.filter(w=>(state.tab==='all'||w.state===state.tab)&&(!q||w.id.includes(q)||w.info[2].includes(q))&&(!state.collectedOnly||w.collected));if(state.sort==='alpha')list.sort((a,b)=>a.id.localeCompare(b.id));return list}
function render(){
 const all=data(),book=books.find(b=>b.id===state.book),matches=matching(),visible=matches.slice(0,state.limit),covered=all.filter(w=>w.state!=='new').length;
 $('book-title').textContent=book.title;$('book-summary').textContent=`示例词书 · ${all.length}词 · 已覆盖${covered}词`;
 $('book-role').textContent=state.book===state.studyBook?'正在使用':'仅查看';$('view-note').hidden=state.book===state.studyBook;$('view-note').textContent='当前学习词书仍是：'+books.find(b=>b.id===state.studyBook).title;
 $('tabs').innerHTML=Object.entries(labels).map(([id,label])=>`<button type="button" data-tab="${id}" aria-pressed="${state.tab===id}">${label}<small>${id==='all'?all.length:all.filter(w=>w.state===id).length}</small></button>`).join('');
 $('search').value=state.query;$('sort').value=state.sort;$('collected-only').checked=state.collectedOnly;$('show-meaning').checked=state.meaning;
 $('result-count').innerHTML=`<strong>${matches.length} 词</strong> ${matches.length===all.length?'· 整本词表':'· 筛选结果 / 本书 '+all.length+' 词'}`;
 $('word-list').innerHTML=visible.length?visible.map(w=>`<article class="word-row"><button type="button" class="word-open" data-word="${w.id}" aria-label="查看单词 ${w.id}"><strong lang="en">${w.id}</strong>${state.meaning?'<span class="meaning">'+escape(w.info[2])+'</span>':''}</button><span class="status ${w.state} ${w.state==='review'&&w.due?'due':''}">${status(w)}</span><button type="button" class="star" data-star="${w.id}" aria-pressed="${w.collected}" aria-label="${w.collected?'取消收藏':'收藏'} ${w.id}"><svg aria-hidden="true"><use href="#star"/></svg></button></article>`).join(''):'<div class="empty"><strong>没有匹配的单词</strong><p>试试其他关键词，或调整学习状态和收藏筛选。</p><button type="button" data-clear>清空筛选</button></div>';
 $('page-info').textContent=`已显示 ${visible.length} / ${matches.length} 词`;$('more').hidden=visible.length>=matches.length;
 $('book-options').innerHTML=books.map(b=>{const covered=b.ids.filter(id=>state.words[id].state!=='new').length;return `<article class="shelf-card" aria-label="${b.title}"><div class="card-badges"><span class="pill">参考词书</span>${b.id===state.studyBook?'<span class="pill">正在使用</span>':''}</div><h3>${b.title}</h3><p class="shelf-source">示例词书 · 本地演示</p><p class="shelf-count">本书 <strong>${b.ids.length}</strong> 词 <span>已覆盖 ${covered} 词</span></p><progress value="${covered}" max="${b.ids.length}" aria-label="${b.title}覆盖进度"></progress><div class="shelf-actions"><button type="button" data-view="${b.id}" aria-label="查看${b.title}词表">查看词表</button><button type="button" class="${b.id===state.studyBook?'':'primary'}" data-use="${b.id}" ${b.id===state.studyBook?'disabled':''} aria-label="${b.id===state.studyBook?'当前词书：':'切换使用'}${b.title}">${b.id===state.studyBook?'当前词书':'切换使用'}</button></div></article>`}).join('');save();
}
function clear(){state.tab='all';state.query='';state.collectedOnly=false;state.limit=12;render()}
function openWord(id){selected=id;renderDetail();$('voice-error').textContent='';$('word-dialog').showModal()}
function renderDetail(){const w=state.words[selected],info=seed.find(x=>x[0]===selected);$('detail-word').textContent=info[0];$('detail-meaning').textContent=info[2];$('voices').innerHTML=['UK','US'].map(code=>`<button type="button" data-speak="${code}" aria-label="${code==='UK'?'英式朗读':'美式朗读'}" title="浏览器合成朗读；音标为通用标注"><b>${code}</b><span>/${info[1]}/</span><svg aria-hidden="true"><use href="#speaker"/></svg></button>`).join('');$('arrangement').innerHTML=`<span class="pill">${status(w)}</span>`;$('example-en').textContent=info[3];$('example-zh').textContent=info[4];$('collect-action').textContent=w.collected?'取消收藏':'加入生词本';$('master-action').textContent=w.state==='mastered'?'恢复原学习安排':'标记熟练 · 免复习'}
function update(){render();renderDetail()}
function collect(id){state.words[id].collected=!state.words[id].collected;feedback(state.words[id].collected?'已加入演示生词本':'已取消演示收藏');render();if(selected===id&&$('word-dialog').open)renderDetail()}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;state.limit=12;render()});
$('search').addEventListener('input',e=>{state.query=e.target.value;state.limit=12;render()});
$('sort').addEventListener('change',e=>{state.sort=e.target.value;render()});
for(const [id,prop] of [['collected-only','collectedOnly'],['show-meaning','meaning']])$(id).addEventListener('change',e=>{state[prop]=e.target.checked;state.limit=12;render()});
$('clear').addEventListener('click',clear);$('word-list').addEventListener('click',e=>{const word=e.target.closest('[data-word]'),star=e.target.closest('[data-star]');if(word)openWord(word.dataset.word);else if(star)collect(star.dataset.star);else if(e.target.closest('[data-clear]'))clear()});
$('more').addEventListener('click',()=>{state.limit+=12;render()});
$('switch-book').addEventListener('click',()=>$('books-dialog').showModal());
$('book-options').addEventListener('click',e=>{const view=e.target.closest('[data-view]'),use=e.target.closest('[data-use]');if(!view&&!use)return;const id=(view||use).dataset[view?'view':'use'];if(use)state.studyBook=id;const changed=state.book!==id;if(changed){state.book=id;state.scroll=0;clear()}else render();$('books-dialog').close();if(changed)window.scrollTo({top:0,behavior:'instant'});feedback(use?'已切换示例学习词书，原学习记录已保留':state.studyBook===id?'正在查看当前学习词书':'正在查看词表，学习词书保持不变')});
$('collect-action').addEventListener('click',()=>collect(selected));
$('master-action').addEventListener('click',()=>{const w=state.words[selected];if(w.state==='mastered'){w.state=w.prior||'new';w.prior=null;feedback('已恢复原学习安排')}else{w.prior=w.state;w.state='mastered';feedback('已标记演示熟练，此词不再安排复习')}update()});
$('voices').addEventListener('click',e=>{const b=e.target.closest('[data-speak]');if(!b)return;const n=++voiceSequence;$('voice-error').textContent='';if(!window.speechSynthesis){$('voice-error').textContent='浏览器暂不支持朗读。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(selected);u.lang=b.dataset.speak==='UK'?'en-GB':'en-US';const preferred=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase()===u.lang.toLowerCase());if(preferred)u.voice=preferred;u.onerror=event=>{if(n===voiceSequence&&!['canceled','interrupted'].includes(event.error))$('voice-error').textContent='朗读暂不可用，可以重试。'};speechSynthesis.speak(u)});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
for(const id of ['word-dialog','books-dialog'])$(id).addEventListener('click',e=>{if(e.target!==$(id))return;const r=$(id).getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$(id).close()});
$('word-dialog').addEventListener('close',()=>{voiceSequence++;window.speechSynthesis?.cancel();const opener=document.querySelector(`[data-word="${selected}"]`);(opener||document.querySelector('#tabs [aria-pressed=true]'))?.focus({preventScroll:true});selected=null});
$('reset').addEventListener('click',()=>{state=initial();render();window.scrollTo({top:0,behavior:'instant'});feedback('演示已重置，真实学习数据不受影响')});
window.addEventListener('scroll',()=>{state.scroll=window.scrollY;clearTimeout(scrollTimer);scrollTimer=setTimeout(save,150)},{passive:true});
render();requestAnimationFrame(()=>window.scrollTo({top:Number(state.scroll)||0,behavior:'instant'}));
</script>
</html>
