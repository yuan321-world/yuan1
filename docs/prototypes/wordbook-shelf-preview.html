<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lingua Loop · 学习书架原型</title>
<style>
:root{--bg:#f5f5ed;--paper:#faf8ef;--ink:#273227;--muted:#606b5e;--line:#dce2d3;--green:#48623c;--soft:#e8efdf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}
main{max-width:820px;margin:auto;padding:22px 16px 36px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:16px}small,.muted{color:var(--muted);font-size:12px}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:6px 13px}button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.search{display:block;margin:14px 0 8px}.search input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
nav{display:flex;flex-wrap:wrap;gap:7px}nav button{border-radius:99px}nav [aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
#feedback{min-height:24px;color:var(--green);font-size:13px;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
article{display:grid;gap:6px;padding:13px 15px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
article.current{border-color:var(--green)}.badges{display:flex;justify-content:space-between;align-items:center;gap:6px}
.badge{background:var(--soft);color:var(--green);border-radius:99px;padding:2px 8px;font-size:11px}.count strong{font-size:23px;font-variant-numeric:tabular-nums}
progress{appearance:none;width:100%;height:5px;border:0;border-radius:8px;overflow:hidden;background:var(--line);accent-color:var(--green)}
progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:var(--green)}
article button{margin-top:4px;width:100%;color:var(--green)}article button:disabled{background:var(--soft);border-color:transparent}
.empty{grid-column:1/-1;padding:28px 0;text-align:center;color:var(--muted)}
@media(max-width:540px){.grid{grid-template-columns:1fr}main{padding-top:16px}}
</style>
<main>
  <header><div><h1>你的学习书架</h1><p class="muted">搜索词书，查看学习覆盖，选择下次学习的来源。</p></div><span class="badge">示例数据</span></header>
  <label class="search"><span class="muted">搜索词书</span><input id="search" type="search" placeholder="输入名称，例如六级"></label>
  <nav aria-label="来源筛选"><button data-group="all" aria-pressed="true">全部</button><button data-group="book" aria-pressed="false">参考词书</button><button data-group="personal" aria-pressed="false">个人来源</button></nav>
  <p id="feedback" role="status">当前使用「大学英语四级 · 参考词表」</p>
  <section id="books" class="grid" aria-label="词书列表"></section>
</main>
<script>
const books = [
  {id:'cet4', title:'大学英语四级 · 参考词表', group:'book', source:'ECDICT 本地参考', total:3846, learned:137},
  {id:'cet6', title:'大学英语六级 · 核心词汇', group:'book', source:'考试词汇示例', total:4280, learned:32},
  {id:'graduate', title:'考研英语 · 核心词汇', group:'book', source:'考试词汇示例', total:5100, learned:31},
  {id:'school', title:'高中英语 · 常用词汇', group:'book', source:'课内词汇示例', total:3500, learned:214},
  {id:'reading', title:'我的阅读生词', group:'personal', source:'外刊精读收藏示例', total:128, learned:47},
  {id:'mistakes', title:'我的易错词', group:'personal', source:'个人词单示例', total:82, learned:26},
];
let current = 'cet4';
let group = 'all';
const search = document.querySelector('#search');
const list = document.querySelector('#books');
const feedback = document.querySelector('#feedback');
function render(){
  const query = search.value.trim().toLowerCase();
  const visible = books.filter(book => (group === 'all' || book.group === group) && book.title.toLowerCase().includes(query));
  list.innerHTML = visible.length ? visible.map(book => {
    const selected = current === book.id;
    return `<article class="${selected ? 'current' : ''}">
      <div class="badges"><span class="badge">${book.group === 'book' ? '参考词书' : '个人来源'}</span>${selected ? '<span class="badge">正在使用</span>' : ''}</div>
      <h2>${book.title}</h2><small>${book.source}</small>
      <div class="count"><strong>${book.total.toLocaleString('zh-CN')}</strong> <small>词</small></div>
      <small>已学 ${book.learned} 词</small>
      <progress value="${book.learned}" max="${book.total}" aria-label="${book.title}的学习覆盖"></progress>
      <button data-book="${book.id}" ${selected ? 'disabled' : ''}>${selected ? '当前词书' : '切换使用'}</button>
    </article>`;
  }).join('') : '<p class="empty">没有找到匹配的词书。</p>';
}
search.addEventListener('input',render);
document.querySelector('nav').addEventListener('click',event=>{
  const button=event.target.closest('[data-group]');
  if(!button)return;
  group=button.dataset.group;
  document.querySelectorAll('[data-group]').forEach(item=>item.setAttribute('aria-pressed',item===button));
  render();
});
list.addEventListener('click',event=>{
  const button=event.target.closest('[data-book]');
  if(!button||button.disabled)return;
  current=button.dataset.book;
  const book=books.find(item=>item.id===current);
  feedback.textContent='已切换至「'+book.title+'」，原学习进度已保留。';
  render();
});
render();
</script>
</html>
