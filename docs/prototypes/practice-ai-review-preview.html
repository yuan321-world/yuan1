<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>写作与翻译批改 · Lingua Loop 交互原型</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#443b33;background:#f7f5f1;font-size:14px;line-height:1.65;--line:#e6e0d6;--green:#596f47;--muted:#81796f}*{box-sizing:border-box}html{scrollbar-gutter:stable}body{margin:0}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);border-radius:18px;background:#fffdf8;padding:7px 15px;cursor:pointer}button:hover:not(:disabled){border-color:var(--green)}button:disabled{cursor:default;opacity:.55}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #839969;outline-offset:3px}button[aria-pressed=true],.primary{background:var(--green);border-color:var(--green);color:white}.muted{color:var(--muted);font-size:12px}.lab{max-width:1300px;margin:14px auto;padding:0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.lab strong{font-size:13px}.lab select{padding:4px 12px}.lab label{font-size:12px}.brand{max-width:850px;margin:20px auto 32px;padding:12px 22px;border:1px solid var(--line);border-radius:40px;display:flex;align-items:center;justify-content:space-between;background:#fffdfb;gap:14px}.brand b{font-size:20px;color:#242622}.brand span{font-size:13px;color:var(--muted)}main{max-width:1300px;margin:auto;padding:0 18px 50px}.workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}.workspace.paper{grid-template-columns:minmax(0,1fr) 246px}.sheet{background:#fffdf8;border:1px solid var(--line);border-radius:22px;overflow:hidden}.heading{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:20px;margin:0;font-weight:700}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}.switch{display:flex;gap:6px}.content{padding:24px 28px}.prompt{background:#f1f2ea;border-left:3px solid var(--green);padding:13px 16px;margin:14px 0 22px}.prompt p{margin:0}.english{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.9}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{font-size:12px;padding:3px 10px;background:#f2efe8;border-radius:20px;white-space:nowrap}.editor{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}textarea{width:100%;min-height:245px;resize:vertical;border:0;background:transparent;display:block;padding:0;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.85}textarea:read-only{color:#625b52}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.actions .muted{margin-left:auto}.notice{margin:12px 0 0;color:#6c6258;font-size:13px;min-height:22px}.review{border-top:1px solid var(--line);padding:22px 28px 28px;background:#fdfcf8;min-height:210px}.review-head{margin-bottom:14px}.review-title{display:flex;gap:10px;align-items:center}.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 18px;color:var(--muted)}.summary{display:grid;grid-template-columns:156px minmax(0,1fr);gap:24px;padding:18px 0 22px}.score{border-right:1px solid var(--line)}.score strong{font:38px Georgia,serif;color:var(--green)}.score span{font-size:14px}.summary p{margin:5px 0}.dims{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dims span{font-size:12px;background:#f0f1e9;border-radius:7px;padding:4px 9px}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:6px}.tabs button{padding:9px 2px;border:0;border-radius:0;background:transparent}.tabs button[aria-selected=true]{border-bottom:2px solid var(--green);color:var(--green);font-weight:bold}.correction{padding:17px 0;border-bottom:1px solid var(--line)}.correction:last-child{border-bottom:0}.correction .english{font-size:16px;margin:8px 0 6px}.correction p{margin:5px 0}.kind{font-size:12px;color:#9a563f;background:#f7eee8;border-radius:5px;padding:3px 8px;margin-right:7px}.kind.optional{color:var(--green);background:#edf1e5}del{text-decoration-color:#ae7259;background:#fbefea}ins{text-decoration:none;background:#eaf0e1;color:#435735;padding:1px 4px}.reference{white-space:pre-wrap;margin:17px 0}.task-note{padding:12px 0;color:var(--muted);font-size:12px}.progress{position:sticky;top:18px;background:#fffdf8;border:1px solid var(--line);border-radius:20px;padding:18px}.progress h2{font-size:15px}.progress .part{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.progress .part button{padding:4px 10px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.numbers span{border:1px solid var(--line);border-radius:5px;text-align:center;font-size:12px;color:#978f86;background:#f5f3ee}.error{color:#9b4435}.history{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.history select{font-size:12px;padding:3px 8px}footer{color:var(--muted);font-size:12px;padding-top:16px}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:850px){.workspace.paper{grid-template-columns:1fr}.progress{position:static;order:2}.numbers{grid-template-columns:repeat(11,1fr)}.brand{margin:16px 18px 22px}.brand span{display:none}.summary{grid-template-columns:125px minmax(0,1fr);gap:16px}}@media(max-width:480px){main{padding:0 10px 32px}.lab{padding:0 12px;gap:8px}.lab>span{width:100%}.heading,.content,.review{padding:17px}.heading{gap:10px}h1{font-size:17px}.switch button{padding:5px 12px}.summary{grid-template-columns:1fr;gap:8px}.score{border-right:0;border-bottom:1px solid var(--line);padding-bottom:12px}.tabs{gap:16px}.tabs button{font-size:13px}.actions .muted{margin-left:0;width:100%}textarea{min-height:280px}.english{font-size:16px}.numbers{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<div class="lab" aria-label="原型演示控制"><strong>交互原型</strong><span class="muted">示例反馈 · 不调用 AI · 刷新清空演示</span><label>查看位置 <select id="context"><option value="single">单项练习</option><option value="paper">整卷练习</option></select></label><label><input type="checkbox" id="fail"> 演示一次批改失败</label></div>
<div class="brand"><b>Lingua Loop</b><span>写下来，再一点点改好。</span></div>
<main><div class="workspace" id="workspace"><article class="sheet">
<header class="heading"><div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div><div class="switch" aria-label="练习类型"><button id="writing" aria-pressed="true">写作</button><button id="translation" aria-pressed="false">翻译</button></div></header>
<section class="content" aria-label="作答区"><div class="row"><h2 id="part"></h2><span class="tag">原创示例</span></div><div class="prompt" id="prompt"></div><div class="row"><h2 id="answer-title"></h2><span class="muted" id="count"></span></div><div class="editor"><textarea id="answer" aria-label="我的作答" maxlength="20000" spellcheck="false"></textarea></div><div class="actions"><button class="primary" id="submit">提交作答</button><button id="revise" hidden>继续修改</button><button id="restore">恢复示例</button><span class="muted" id="save-state">仅保留在本次演示中</span></div><p class="notice" id="notice" role="status"></p></section>
<section class="review" aria-labelledby="review-title"><div class="row review-head"><div class="review-title"><h2 id="review-title">AI 学习反馈</h2><span class="tag">示例</span></div><button class="primary" id="review-button" disabled>开始批改</button></div><div class="history" id="history-wrap" hidden><label for="history">批改记录</label><select id="history"></select><span class="muted">反馈对应当次提交，修改后可重新批改</span></div><div id="feedback" aria-live="polite"></div></section>
</article><aside class="progress" id="progress" hidden aria-label="整卷题号卡示意"><div class="row"><h2>题目</h2><span class="muted" id="paper-count"></span></div><div class="part"><button id="jump-writing">写作 W</button><span id="w-status"></span></div><div class="part">听力 · 1–25 <span class="muted">25/25</span></div><div class="part">选词填空 · 26–35 <span class="muted">10/10</span></div><div class="part">长篇匹配 · 36–45 <span class="muted">10/10</span></div><div class="part">仔细阅读 · 46–55 <span class="muted">10/10</span></div><div class="part"><button id="jump-translation">翻译 T</button><span id="t-status"></span></div><div class="numbers" id="numbers" aria-hidden="true"></div><p class="muted">题号卡为布局示意，本页可体验写作和翻译反馈。客观题结果沿用原卷。</p></aside></div><footer>本页为独立原型，反馈为人工编写的示例。正式版拟在用户主动申请后批改已提交作答，参考评分不计入原卷成绩。</footer></main>
<script>
const examples={
writing:{title:'共享学习空间改善建议',part:'Part I · 写作',label:'我的作文',prompt:'<p class="english">Your university is improving a shared study space. Write a short essay describing one problem and proposing practical improvements. You should write 120–180 words.</p>',
text:'A shared study space is an important part of university life. However, many students in our university finds it difficult to concentrate there. The room is often noisy, and there are not enough sockets for laptops. These problems make it less useful than it could be.\n\nTo improve the situation, I suggest to divide the room into a quiet area and a discussion area. Clear signs would help students choose the right place for their work. The university could also add more sockets and provide a simple system for reporting broken equipment. These changes would not require a large budget, but they could make a real difference.\n\nIn my opinion, a good study space should support different learning needs. By listening to students and making small improvements, the university can create a better place for everyone.',
score:'11',summary:'回应了题目要求，建议具体，段落结构清楚。优先修正主谓一致和动词搭配，再让结尾更具体。',dims:['内容切题 · 较好','结构衔接 · 较好','语言准确 · 待提高'],
notes:[{kind:'语法',original:'many students in our university finds it difficult',suggestion:'many students in our university find it difficult',reason:'主语 many students 是复数，谓语应用 find。',en:'A plural subject takes the base form of the verb in the present simple.'},{kind:'搭配',original:'I suggest to divide the room',suggestion:'I suggest dividing the room',reason:'表示建议做某事时，用 suggest doing；也可以用 suggest that ...。',en:'Use “suggest doing something” to introduce a proposed action.'},{kind:'表达优化',optional:true,original:'create a better place for everyone',suggestion:'create a space where both quiet study and discussion can thrive',reason:'原句没有语法错误；可选修改呼应前文的两类学习需求，使结尾更具体。',en:'This optional change makes the conclusion more specific.'}],
improved:'A shared study space is an important part of university life. However, many students in our university find it difficult to concentrate there. The room is often noisy, and there are not enough sockets for laptops. These problems make it less useful than it could be.\n\nTo improve the situation, I suggest dividing the room into a quiet area and a discussion area. Clear signs would help students choose the right place for their work. The university could also add more sockets and provide a simple system for reporting broken equipment. These changes would not require a large budget, but they could make a real difference.\n\nIn my opinion, a good study space should support different learning needs. By listening to students and making small improvements, the university can create a space where both quiet study and discussion can thrive.'},
translation:{title:'社区里的步行活动',part:'Part IV · 翻译',label:'我的译文',prompt:'<p>近年来，越来越多的社区开始组织周末步行活动。居民们一起探索附近的街道、公园和历史建筑。这些活动不仅鼓励人们锻炼身体，也为邻里交流创造了机会。为了让更多人参与，一些社区提供不同长度的路线，并邀请志愿者介绍沿途的故事。对许多居民来说，步行已经成为了解家乡和结识朋友的一种简单方式。</p>',
text:'In recent years, more and more communities began to organize weekend walks. Residents explore nearby streets, parks and historic buildings together. These activities not only encourage people to exercise, but also create chances for neighbors to communicate. To let more people join, some communities offer routes of different long and invite volunteers to introduce stories along the way. For many residents, walking has become a simple way to learn about their hometowns and make new friends.',
score:'10',summary:'主要信息基本完整，逻辑顺序清楚。需要修正时间表达对应的时态和词性；部分表达可以更自然。',dims:['信息传达 · 较好','语法准确 · 待提高','表达自然 · 可改善'],
notes:[{kind:'时态',original:'In recent years, more and more communities began to organize weekend walks.',suggestion:'In recent years, more and more communities have begun to organize weekend walks.',reason:'“近年来”在这里描述延续到现在的趋势，用现在完成时更贴合原意。',en:'The present perfect links a recent trend to the present.'},{kind:'词性',original:'routes of different long',suggestion:'routes of different lengths',reason:'对应“不同长度的路线”，different 后应使用名词复数 lengths，而非形容词 long。',en:'Use the plural noun “lengths” after “different”.'},{kind:'表达优化',optional:true,original:'To let more people join',suggestion:'To encourage wider participation',reason:'原意可以理解；可选表达更自然、简洁。',en:'The revision expresses the purpose more naturally and concisely.'}],
improved:'In recent years, more and more communities have begun to organize weekend walks. Residents explore nearby streets, parks and historic buildings together. These activities not only encourage people to exercise but also create opportunities for neighbors to interact. To encourage wider participation, some communities offer routes of different lengths and invite volunteers to share stories along the way. For many residents, walking has become a simple way to learn about their hometowns and make new friends.'}
};
const $=id=>document.getElementById(id), states={writing:fresh('writing'),translation:fresh('translation')};let mode='writing',tab='notes',sequence=0;
function fresh(k){return{draft:examples[k].text,submitted:null,round:0,records:[],selected:null,busy:false,error:false,guard:false}}
function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return states[mode]}
function count(){const n=$('answer').value.match(/\b[A-Za-z]+(?:['’-][A-Za-z]+)*\b/g)?.length||0;$('count').textContent=n+' 词'+(mode==='writing'?' · 建议 120–180 词':'')}
function render(){const s=current(),e=examples[mode],paper=$('context').value==='paper';$('workspace').classList.toggle('paper',paper);$('progress').hidden=!paper;$('title').textContent=paper?'大学英语四级 · 整卷练习':e.title;$('subtitle').textContent=paper?'写作与翻译批改界面预览':'写作与翻译 · 原创练习';$('part').textContent=e.part;$('answer-title').textContent=e.label;$('prompt').innerHTML=e.prompt;$('answer').value=s.submitted??s.draft;$('answer').readOnly=s.submitted!==null;$('submit').hidden=s.submitted!==null;$('revise').hidden=s.submitted===null;$('submit').disabled=!s.draft.trim();$('restore').disabled=s.busy;$('revise').disabled=s.busy;['writing','translation'].forEach(k=>$(k).setAttribute('aria-pressed',String(k===mode)));$('save-state').textContent=s.submitted!==null?'已提交 · 第 '+s.round+' 轮':'仅保留在本次演示中';$('notice').textContent=s.submitted!==null?'作答已冻结。继续修改会创建新一轮，原批改记录保留。':'';$('w-status').textContent=states.writing.submitted!==null?'已提交':'未提交';$('t-status').textContent=states.translation.submitted!==null?'已提交':'未提交';$('paper-count').textContent='示意 '+(55+Number(states.writing.submitted!==null)+Number(states.translation.submitted!==null))+'/57';count();renderFeedback()}
function renderFeedback(){const s=current(),e=examples[mode],record=s.records.find(r=>r.id===s.selected);$('review-button').disabled=s.busy||s.submitted===null||!!s.records.find(r=>r.round===s.round);$('review-button').textContent=s.busy?'正在批改…':s.error?'重试批改':s.records.find(r=>r.round===s.round)?'本轮已批改':'开始批改';$('history-wrap').hidden=!s.records.length;$('history').replaceChildren(...s.records.map(r=>{const o=document.createElement('option');o.value=r.id;o.textContent='第 '+r.round+' 轮 · 示例反馈';o.selected=r.id===s.selected;return o}));
if(s.busy){$('feedback').innerHTML='<div class="empty" role="status">正在生成示例反馈，请稍候…</div>';return}
if(s.error){$('feedback').innerHTML='<div class="empty error" role="alert">本次批改未完成，作答已保留。可以重试批改。</div>';return}
if(s.guard){$('feedback').innerHTML='<div class="empty">你已修改示例作答。本原型不调用模型，预置反馈无法评价这份新文本。可继续修改，或点击“恢复示例”体验批改；恢复前会提示保留当前文本。</div>';return}
if(!record){$('feedback').innerHTML='<div class="empty">'+(s.submitted===null?'提交作答后，可以申请批改。':'作答已提交，点击“开始批改”查看示例反馈。')+'</div>';return}
$('feedback').innerHTML='<div class="task-note">第 '+record.round+' 轮提交 · '+(record.round===s.round&&s.submitted!==null?'当前提交':'历史提交，未用于评价当前草稿')+'</div><div class="summary"><div class="score"><div class="muted">学习参考分 · 示例</div><strong>'+e.score+'</strong><span> / 15</span><div class="muted">项目演示量表，不换算考试分</div></div><div><h3>先改这两处，再打磨表达</h3><p>'+e.summary+'</p><div class="dims">'+e.dims.map(d=>'<span>'+d+'</span>').join('')+'</div></div></div><div class="tabs" role="tablist" aria-label="反馈内容"><button role="tab" id="tab-notes" aria-controls="review-panel" aria-selected="'+(tab==='notes')+'" tabindex="'+(tab==='notes'?'0':'-1')+'">逐句批注 · 3</button><button role="tab" id="tab-reference" aria-controls="review-panel" aria-selected="'+(tab==='reference')+'" tabindex="'+(tab==='reference'?'0':'-1')+'">参考修改稿</button><button role="tab" id="tab-original" aria-controls="review-panel" aria-selected="'+(tab==='original')+'" tabindex="'+(tab==='original'?'0':'-1')+'">当次原文</button></div><div id="review-panel" role="tabpanel" aria-labelledby="tab-'+tab+'">'+(tab==='notes'?e.notes.map(n=>'<article class="correction"><span class="kind '+(n.optional?'optional':'')+'">'+n.kind+'</span><span class="muted">'+(n.optional?'可选修改':'建议修正')+'</span><p class="english"><del>'+escape(n.original)+'</del><br><ins>'+escape(n.suggestion)+'</ins></p><p>'+n.reason+'</p><p class="muted">'+escape(n.en)+'</p></article>').join(''):tab==='reference'?'<p class="muted task-note">仅供比较与学习，不会覆盖你的原文。</p><div class="english reference">'+escape(e.improved)+'</div>':'<div class="english reference">'+escape(record.text)+'</div>')+'</div>';
document.querySelectorAll('[role=tab]').forEach(b=>{b.onclick=()=>{tab=b.id.slice(4);renderFeedback();$(b.id).focus({preventScroll:true})};b.onkeydown=ev=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;ev.preventDefault();const order=['notes','reference','original'],i=order.indexOf(tab);tab=ev.key==='Home'?order[0]:ev.key==='End'?order[2]:order[(i+(ev.key==='ArrowRight'?1:2))%3];renderFeedback();$('tab-'+tab).focus({preventScroll:true})}})}
function switchMode(k){mode=k;tab='notes';render()}
$('writing').onclick=()=>switchMode('writing');$('translation').onclick=()=>switchMode('translation');$('jump-writing').onclick=()=>switchMode('writing');$('jump-translation').onclick=()=>switchMode('translation');$('context').onchange=render;
$('answer').oninput=()=>{current().draft=$('answer').value;current().guard=false;count();$('submit').disabled=!$('answer').value.trim()};
$('submit').onclick=()=>{const s=current();if(!s.draft.trim())return;s.submitted=s.draft;s.round++;s.error=false;s.guard=false;render()};
$('revise').onclick=()=>{const s=current();s.draft=s.submitted;s.submitted=null;s.error=false;s.guard=false;render();$('answer').focus({preventScroll:true})};
$('restore').onclick=()=>{const s=current();if(s.draft!==examples[mode].text&&!confirm('恢复示例将替换当前作答，请先自行复制要保留的文本。继续恢复吗？'))return;s.draft=examples[mode].text;s.submitted=null;s.error=false;s.guard=false;render()};
$('review-button').onclick=()=>{const s=current(),k=mode;if(s.submitted===null||s.busy)return;if(s.submitted!==examples[k].text){s.guard=true;renderFeedback();return}const fail=$('fail').checked;$('fail').checked=false;s.busy=true;s.error=false;render();setTimeout(()=>{s.busy=false;if(fail){s.error=true}else{const record={id:String(++sequence),round:s.round,text:s.submitted};s.records.push(record);s.selected=record.id}if(mode===k)render()},650)};
$('history').onchange=()=>{current().selected=$('history').value;tab='notes';renderFeedback()};$('numbers').replaceChildren(...Array.from({length:55},(_,i)=>{const span=document.createElement('span');span.textContent=i+1;return span}));render();
</script>
</body></html>
