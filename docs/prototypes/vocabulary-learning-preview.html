const defaults=()=>({version:2,spellingInput:'',spellingError:'',spellingHint:false,lastWrong:'',screen:'home',mode:'recognition',source:'personal',kind:'new',active:false,phase:'question',queue:[],batch:[],passed:[],failures:{},schedule:{},outcome:null,choices:[],newGoal:20,reviewGoal:50});
let state=defaults(),storageAvailable=true,toastTimer,opener=null;
try{const stored=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(stored&&[1,2].includes(stored.version)&&['home','study','result'].includes(stored.screen)&&['recognition','meaning','spelling'].includes(stored.mode)&&sourceIds[stored.source]&&Array.isArray(stored.queue)&&stored.queue.every(id=>words[id])&&Array.isArray(stored.batch)&&stored.batch.every(id=>words[id])&&Array.isArray(stored.passed)&&stored.passed.every(id=>words[id])){state={...defaults(),...stored,version:2,mode:stored.mode==='meaning'?'recognition':stored.mode}}}catch{storageAvailable=false}
const app=document.getElementById('app'),intervals=[1,3,7,14,30];
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modeName=()=>state.mode==='recognition'?'认词与选义':'中文拼写';
const sourceName=()=>state.source==='personal'?'我的阅读生词':'词书版式预览';
function save(){try{sessionStorage.setItem(storageKey,JSON.stringify(state))}catch{storageAvailable=false}document.getElementById('storage-status').textContent=storageAvailable?'仅保存在本标签页，关闭后清除':'浏览器限制存储，本页仍可体验，刷新可能丢失'}
function toast(message){const node=document.getElementById('toast');clearTimeout(toastTimer);node.textContent=message;node.hidden=false;toastTimer=setTimeout(()=>node.hidden=true,3500)}
function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function openDialog(id,trigger){opener=trigger||document.activeElement;document.getElementById(id).showModal()}
document.querySelectorAll('dialog').forEach(dialog=>{dialog.addEventListener('close',()=>{if(opener?.isConnected)opener.focus()});dialog.addEventListener('click',event=>{if(event.target.closest('[data-close]'))dialog.close()})});
function headingFocus(){requestAnimationFrame(()=>{const heading=app.querySelector('#spelling-input')||app.querySelector('[data-focus]');heading?.focus({preventScroll:true})})}
function render(){save();if(state.screen==='study'&&state.active&&state.queue.length)renderStudy();else if(state.screen==='result'&&state.phase==='complete')renderResult();else renderHome()}
function renderHome(){const resumable=state.active&&state.queue.length,ids=sourceIds[state.source];app.innerHTML=`<div class="page-heading"><div><h1 tabindex="-1" data-focus>背单词</h1><p>遇见一个词，再多记住一点。</p></div><div class="date">从阅读中的一句话<br>到下一次自然想起</div></div><div class="home-grid"><section class="study-home"><div class="section-title"><h2>${sourceName()}</h2><button data-action="source">切换来源</button></div><p class="source-note">${state.source==='personal'?'使用阅读里遇见的词，连同原句一起积累。':'词书页面的交互预览，正式四级词表尚未接入。'}</p><div class="chips">${ids.map(id=>`<span class="chip" lang="en">${words[id].word}</span>`).join('')}</div><p class="muted small">本次仅 ${ids.length} 个演示词，不是你的真实收藏。</p><div class="divider"></div>${resumable?`<div class="resume-note">本轮尚未结束 · ${modeName()} · 已通过 ${state.passed.length} / ${state.batch.length} 词。暂停和刷新都会保留当前释义与队列。</div>`:''}<div class="modes" role="group" aria-label="练习方式"><button data-mode="recognition" aria-pressed="${state.mode==='recognition'}">认词与选义</button><button data-mode="spelling" aria-pressed="${state.mode==='spelling'}">中文拼写</button></div><p class="mode-description">${state.mode==='recognition'?'可以选择中文意思，也可以点“认识”直接看释义。不认识或选错的词移到队尾。':'根据中文逐字拼写英文，输错清空重打；完整拼对自动看释义，再由你点击下一个。'}</p><div class="actions"><button class="primary" data-action="start">${resumable?'继续本轮':state.mode==='recognition'?'开始认词':'开始拼写'}</button><button data-action="review">复习流程演示</button></div></section><aside class="side-plan"><div class="section-title"><h2>留一点时间给单词</h2><button class="text small" data-action="settings">调整</button></div><dl class="goals"><div><dt>每日新增目标</dt><dd>${state.newGoal}<small>词</small></dd></div><div><dt>每日复习目标</dt><dd>${state.reviewGoal}<small>词</small></dd></div></dl><p class="rule-note">这里仅预览目标设置。正式学习将根据实际词条生成任务，未接入的记录不做统计。</p><ul class="steps"><li><span></span>认识 / 选对 → 看释义，再继续</li><li><span></span>不认识 / 选错 → 放到本轮队尾</li><li><span></span>中文拼写 → 拼对后才可进入下一词</li><li><span></span>本轮通过 → 1、3、7、14、30 天复习</li></ul><p class="storage-note">可先故意点一次“不认识”，观察它如何排到最后。最后只剩一个词时也能暂停。</p></aside></div>`}
function shuffled(values){const result=[...values];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function prepareChoices(){const id=state.queue[0];state.choices=shuffled([id,...shuffled(Object.keys(words).filter(other=>other!==id)).slice(0,3)])}
function start(kind='new'){if(state.active&&state.queue.length){state.screen='study';render();headingFocus();return}state.active=true;state.kind=kind;state.phase='question';state.batch=[...sourceIds[state.source]];state.queue=[...state.batch];state.passed=[];state.failures={};state.schedule={};state.outcome=null;state.spellingInput='';state.spellingError='';state.spellingHint=false;state.lastWrong='';prepareChoices();state.screen='study';render();headingFocus()}
function renderStudy(){
 const id=state.queue[0],word=words[id],definition=state.phase==='definition',spelling=state.mode==='spelling',ok=state.outcome?.ok,percent=Math.round(state.passed.length/state.batch.length*100);
 const sound=`<button class="sound" data-action="sound" aria-label="朗读当前单词"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>`;
 const wordHeading=spelling&&!definition?`<div class="spelling-top"><h2 tabindex="-1" data-focus>根据中文，写出英文</h2>${sound}</div>`:`<div class="word-title"><h2 lang="en" tabindex="-1" data-focus>${word.word}</h2>${sound}</div><p class="phonetic">${word.phonetic}</p>`;
 const question=spelling?`<form id="spelling-form" autocomplete="off"><p class="spelling-meaning"><span>${word.pos}</span> ${word.meaning}</p><p class="spelling-context">${word.extra}</p><label class="visually-hidden" for="spelling-input">输入英文拼写</label><input id="spelling-input" class="spelling-input ${state.spellingError?'invalid':''}" value="${escapeHtml(state.spellingInput)}" placeholder="${'_'.repeat(word.word.length)}" type="text" lang="en" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" aria-invalid="${!!state.spellingError}" aria-describedby="spelling-error spelling-instruction"><p id="spelling-error" class="spelling-error" role="alert">${escapeHtml(state.spellingError)}</p><div class="spelling-actions"><button class="text" type="button" data-action="hint">${state.spellingHint?'提示已显示':'给一点提示'}</button><span class="small muted">逐字校验 · 拼对自动显示释义</span></div>${state.spellingHint?`<p class="spelling-hint" role="status">以 ${word.word[0]} 开头，共 ${word.word.length} 个字母。仍需完整拼对才能继续。</p>`:''}<p class="question-prompt" id="spelling-instruction">每个字母即时检查，输错会清空整次输入，从头重打。<br>忽略大小写；完整拼对自动显示释义，再点击下一个。</p></form>`:`<p class="question-prompt">可以选中文，也可以直接判断是否认识。</p><div class="recognition integrated"><button data-feedback="unknown">不认识</button><button class="primary" data-feedback="known">认识</button></div><div class="choices">${state.choices.map((option,i)=>`<button class="choice" data-choice="${option}"><span>${'ABCD'[i]}</span>${words[option].meaning}</button>`).join('')}</div><p class="small muted" style="text-align:center">选对或点认识都先看释义，不会自动跳到下一词。</p>`;
 const result=definition?`<section class="definition" aria-label="单词释义"><div class="result-line" role="status"><strong>${ok?(spelling?'拼写正确':state.outcome.selected?'中文意思选对了':'已标记认识'):(state.outcome.selected?'这次选错了':'先记住这一次')}</strong><span>${ok?'看完释义，再继续。':'看完释义，稍后在队尾再遇见它。'}</span></div>${!ok&&state.outcome.selected?`<p class="small muted">刚才选择：${escapeHtml(words[state.outcome.selected].meaning)}</p>`:''}<p class="definition-meaning"><span class="muted small">${word.pos}</span> ${word.meaning}</p><p class="definition-extra">${word.extra}</p><blockquote class="example"><p lang="en">${word.example}</p><small>${word.translation}</small></blockquote><p class="source">阅读原句 · <a href="http://127.0.0.1:4174/reading/${word.article}" target="_blank" rel="noopener">${word.title} ↗</a></p><div class="continue-row"><p>${ok?`演示安排：${state.schedule[id].days} 天后复习${state.failures[id]?'（本轮曾出错，从 1 天开始）':''}`:'点击继续后放到本轮待学队尾，不会跳过。'}</p><button class="primary" data-action="next">${ok?'下一个':'继续，稍后再练'}</button></div></section>`:'';
 app.innerHTML=`<div class="session-head"><div><h1>${modeName()}<span class="small muted"> · ${state.kind==='review'?'复习演示':'新词演示'}</span></h1><p>${sourceName()} · 本轮 ${state.batch.length} 词</p></div><button data-action="pause">暂停本轮</button></div><div class="study-grid"><section class="word-card ${spelling?'spelling-card':''}" aria-label="当前单词"><div class="progress-heading"><span>本轮已通过 ${state.passed.length} / ${state.batch.length}</span><span>${state.failures[id]?'再试一次，慢慢来':'慢一点，也没关系'}</span></div><div class="progress-track" role="progressbar" aria-label="本轮通过进度" aria-valuenow="${state.passed.length}" aria-valuemin="0" aria-valuemax="${state.batch.length}"><div class="progress-fill" style="width:${percent}%"></div></div>${wordHeading}${definition?result:question}</section><aside class="queue-panel"><h2>${spelling?'本轮拼写任务':'本轮待学顺序'}</h2><p>${definition?'当前释义会保留到你点击继续。':spelling?'拼对当前词，才能继续下一词。':'这是当前批次，不是整本词书。'}</p><ol class="queue-list">${state.queue.map((q,i)=>`<li class="${i===0?'current ':''}${state.failures[q]?'retry':''}"><b ${spelling?'':'lang="en"'}>${spelling?escapeHtml(words[q].meaning):words[q].word}</b><small>${i===0?'当前':state.failures[q]?'再练':'待学'}</small></li>`).join('')}</ol><p class="queue-note">${spelling?'输错一个字母，整次输入清空，仍留在当前词。<br>可以看提示或暂停，回来继续。':'不认识或选错的词，看完释义后移到最后。<br>同一词只计一次本轮通过。'}</p>${state.queue.length===1?'<p class="queue-note">只剩这一个词也不必勉强。可以随时暂停，回来继续。</p>':''}</aside></div>`;
}
function validateSpelling(input){
 if(!state.active||state.mode!=='spelling'||state.phase!=='question'||spellingComposing)return;
 const value=input.value.toLowerCase(),expected=words[state.queue[0]].word;
 // A trailing input event can follow compositionend: an empty field is harmless.
 if(!value){state.spellingInput='';save();return}
 if(!expected.startsWith(value)){
  state.failures[state.queue[0]]=(state.failures[state.queue[0]]||0)+1;
  state.spellingInput='';input.value='';state.spellingError='这个字母不对，已清空，请从头重新输入。';
 }else{state.spellingInput=input.value;state.spellingError=''}
 input.setAttribute('aria-invalid',String(!!state.spellingError));input.classList.toggle('invalid',!!state.spellingError);
 document.getElementById('spelling-error').textContent=state.spellingError;
 if(value===expected){feedback(true);return}save();
}
function feedback(ok,selected=null){if(!state.active||state.phase!=='question')return;const id=state.queue[0];state.outcome={ok,selected};state.phase='definition';if(ok){if(!state.passed.includes(id)){state.passed.push(id);const stage=state.failures[id]?1:Math.min((state.kind==='review'?words[id].stage:0)+1,5);state.schedule[id]={days:intervals[stage-1],stage}}}else state.failures[id]=(state.failures[id]||0)+1;render();headingFocus()}
function next(){if(state.phase!=='definition')return;const id=state.queue.shift();if(!state.outcome.ok)state.queue.push(id);state.outcome=null;state.spellingInput='';state.spellingError='';state.spellingHint=false;state.lastWrong='';stopVoice();if(!state.queue.length){state.phase='complete';state.active=false;state.screen='result'}else{state.phase='question';prepareChoices()}render();headingFocus()}
function renderResult(){const attempts=Object.values(state.failures).reduce((sum,n)=>sum+n,0);app.innerHTML=`<section class="round-finished"><span class="finished-symbol" aria-hidden="true">✓</span><h1 tabindex="-1" data-focus>这一轮，全部通过了。</h1><p class="muted">${modeName()} · ${state.batch.length} 个演示词。本轮反复出现的词，只计一次通过。</p><div class="result-metrics"><div><span>本轮通过</span><b>${state.passed.length}<small class="small muted"> 词</small></b></div><div><span>${state.mode==='spelling'?'拼写重试':'队尾重练'}</span><b>${attempts}<small class="small muted"> 次</small></b></div></div><h2 style="font-size:17px">下一次，留给未来的自己</h2><ul class="schedule-list">${state.batch.map(id=>`<li><b lang="en">${words[id].word}</b><span>${state.schedule[id].days} 天后复习${state.failures[id]?'<br>本轮曾忘记，重新从 1 天开始':''}</span></li>`).join('')}</ul><p class="muted small">这里只演示复习安排，没有生成真实任务、学习统计或打卡。</p><div class="actions"><button class="primary" data-action="home">返回背单词</button><button data-action="restart">换一种方式体验</button></div></section>`}
function reset(){stopVoice();const {newGoal,reviewGoal}=state;state={...defaults(),newGoal,reviewGoal};render();headingFocus()}
app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.feedback){feedback(button.dataset.feedback==='known');return}if(button.dataset.choice){feedback(button.dataset.choice===state.queue[0],button.dataset.choice);return}if(button.dataset.mode){if(state.active){toast('本轮方式会保留。请继续本轮，或重置后切换。');return}state.mode=button.dataset.mode;render();app.querySelector('[data-mode="'+state.mode+'"]')?.focus();return}switch(button.dataset.action){case'start':start();break;case'review':start('review');break;case'pause':stopVoice();state.screen='home';render();headingFocus();break;case'home':state.screen='home';render();headingFocus();break;case'restart':reset();break;case'next':next();break;case'source':if(state.active){toast('请先继续本轮，或重置后切换学习来源。');break}document.querySelectorAll('[data-source]').forEach(b=>b.classList.toggle('selected',b.dataset.source===state.source));openDialog('source-dialog',button);break;case'settings':document.getElementById('new-goal').value=state.newGoal;document.getElementById('review-goal').value=state.reviewGoal;openDialog('settings-dialog',button);break;case'hint':state.spellingHint=true;render();headingFocus();break;case'sound':if(!('speechSynthesis'in window)){toast('浏览器未提供朗读功能，仍可继续学习。');break}stopVoice();const voice=new SpeechSynthesisUtterance(words[state.queue[0]].word);voice.lang='en-US';voice.onerror=()=>toast('合成朗读暂不可用，请检查浏览器语音设置。');speechSynthesis.speak(voice);break}});
document.getElementById('settings-form').addEventListener('submit',event=>{event.preventDefault();const newGoal=Number(document.getElementById('new-goal').value),reviewGoal=Number(document.getElementById('review-goal').value);if(!Number.isInteger(newGoal)||newGoal<1||newGoal>100||!Number.isInteger(reviewGoal)||reviewGoal<1||reviewGoal>200)return;state.newGoal=newGoal;state.reviewGoal=reviewGoal;document.getElementById('settings-dialog').close();render();app.querySelector('[data-action=settings]')?.focus();toast('演示目标已保存，本轮词数不变。')});
document.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>{if(state.active)return;state.source=button.dataset.source;document.getElementById('source-dialog').close();render();app.querySelector('[data-action=source]')?.focus()}));
document.getElementById('reset').addEventListener('click',event=>openDialog('reset-dialog',event.currentTarget));document.getElementById('confirm-reset').addEventListener('click',()=>{document.getElementById('reset-dialog').close();reset()});
for(const id of ['brand','vocabulary-nav'])document.getElementById(id).addEventListener('click',event=>{event.preventDefault();stopVoice();state.screen='home';render()});
document.getElementById('menu').addEventListener('click',event=>{const open=document.getElementById('navigation').classList.toggle('open');event.currentTarget.setAttribute('aria-expanded',String(open))});
document.addEventListener('keydown',event=>{if(document.querySelector('dialog[open]')||event.target.closest('input,button,textarea,a')||state.screen!=='study')return;if(state.phase==='definition'&&event.key==='Enter'){event.preventDefault();next()}else if(state.phase==='question'&&state.mode==='recognition'&&'1234'.includes(event.key)&&event.key.length===1){event.preventDefault();const selected=state.choices[Number(event.key)-1];feedback(selected===state.queue[0],selected)}});
let spellingComposing=false;
app.addEventListener('compositionstart',event=>{if(event.target.id==='spelling-input')spellingComposing=true});
app.addEventListener('compositionend',event=>{if(event.target.id==='spelling-input'){spellingComposing=false;validateSpelling(event.target)}});
app.addEventListener('input',event=>{if(event.target.id==='spelling-input'&&!event.isComposing)validateSpelling(event.target)});
app.addEventListener('submit',event=>{if(event.target.id==='spelling-form'){event.preventDefault();validateSpelling(document.getElementById('spelling-input'))}});
render();
</script>
</body>
</html>
