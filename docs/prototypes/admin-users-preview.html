<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · Lingua Loop 原型</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;color:#19191d;background:#f8f8fa}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer;border:1px solid #dedee6;background:white;padding:8px 14px;border-radius:10px;min-height:38px}button:hover{background:#f4f3f6}button:disabled{cursor:default;opacity:.45}.primary{background:#19191d;color:white;border-color:#19191d}.primary:hover{background:#333}.danger{color:#a02f4b}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}.side{background:white;border-right:1px solid #e5e4eb;padding:33px 22px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;white-space:nowrap}.mark{display:grid;place-items:center;background:#19191d;color:white;border-radius:9px;width:35px;height:35px;font-size:25px}.caption{color:#898791;font-size:12px;margin:24px 10px 16px}.side nav{display:grid;gap:6px}.side nav a{padding:10px 13px;border-radius:10px;color:#73717d}.side nav .active{color:#a63150;background:#f8e8ee;font-weight:650}.side footer{font-size:11px;color:#8b8793;margin:40px 12px}main{padding:30px 40px 55px;min-width:0;max-width:1550px}.crumb{border-bottom:1px solid #e5e4eb;color:#7d7886;padding-bottom:23px;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:36px 0 24px}h1{font-size:32px;letter-spacing:-1px;line-height:1.3;margin:0 0 10px}.muted{color:#817b88;font-size:12px;margin:0}h2{font-size:23px;margin:0}h3{font-size:14px;margin:23px 0 10px}.demo{display:flex;gap:12px;padding:13px 17px;border:1px solid #eed9e1;background:#fff8fa;border-radius:12px;margin:0 0 24px;font-size:12px;color:#8a5264}.demo strong{white-space:nowrap}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px;border:1px solid #e3e1e9;background:white;border-radius:14px}input,select,textarea{border:1px solid #dbd9e4;padding:9px 12px;border-radius:9px;background:white;min-width:0}input{flex:1;min-width:180px}label{font-size:12px;color:#6d6674}label select{margin-left:6px}.summary{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;color:#7d7583;font-size:12px}.list{border:1px solid #e1dfe8;border-radius:14px;overflow:hidden;background:white}.row{display:grid;grid-template-columns:minmax(170px,1.5fr) .65fr .65fr .85fr minmax(190px,1fr);gap:18px;align-items:center;padding:22px 20px;border-top:1px solid #eeedf2}.row:first-child{border:0}.row.head{font-size:11px;background:#f3f2f6;color:#787280;padding:13px 20px}.account strong{display:block;font-size:14px}.account small{font-size:11px;color:#8a8390}.badge{display:inline-block;border-radius:99px;background:#f2f1f5;padding:3px 9px;font-size:11px}.badge.ok{color:#3b6a53;background:#edf5ef}.badge.off{color:#a13b56;background:#f9eaf0}.row button{font-size:12px;padding:5px 9px;min-height:32px}.row .actions{display:flex;gap:6px;flex-wrap:wrap}.date{font-size:12px;color:#7e7684}.pager{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 3px;font-size:12px;color:#89818d}.pager div{display:flex;gap:9px;align-items:center}.empty{padding:65px 20px;text-align:center;color:#8a8490}.note{font-size:11px;color:#8c8592;margin-top:27px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);border-radius:13px;background:#242028;color:white;padding:12px 20px;max-width:90%;font-size:12px;z-index:10}dialog{width:min(610px,calc(100% - 28px));max-height:86dvh;overflow:auto;border:1px solid #e1dce6;border-radius:20px;padding:27px;background:#fff;color:#19191d}dialog::backdrop{background:#201b294f;backdrop-filter:blur(3px)}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:22px}.close{border:0;padding:0;min-height:28px;width:28px;font-size:22px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:#f8f7f9;padding:18px;border-radius:12px}.facts small{display:block;font-size:11px;color:#8a8290;margin-bottom:4px}.facts span{overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:23px;flex-wrap:wrap}.explain{font-size:12px;color:#817887;background:#f9f7fa;border-radius:10px;padding:13px;line-height:1.9}.reason{width:100%;min-height:100px;resize:vertical;margin-top:8px}.error{font-size:12px;color:#a43150;min-height:20px;margin:8px 0}.audit{padding:12px 0;border-top:1px solid #eeebf0;font-size:12px}.audit p{margin:4px 0;overflow-wrap:anywhere}.audit small{color:#8b8190}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1100px){main{padding:25px}.shell{grid-template-columns:185px minmax(0,1fr)}.side{padding:28px 15px}.row{grid-template-columns:minmax(130px,1.5fr) .7fr .6fr 1fr;gap:12px}.row .date{display:none}.row .actions{gap:5px}}@media(max-width:700px){.shell{display:block}.side{padding:16px 20px;border-right:0;border-bottom:1px solid #e5e4eb}.side .caption,.side footer{display:none}.side nav{display:flex;overflow:auto;margin-top:15px;gap:5px}.side nav a{white-space:nowrap;font-size:12px;padding:7px 10px}.brand{font-size:18px}.mark{width:29px;height:29px;font-size:21px}main{padding:24px 16px}.crumb{display:none}.heading{margin:5px 0 22px;align-items:start;gap:10px}h1{font-size:27px}.heading>button{font-size:12px;white-space:nowrap}.demo{display:block}.demo strong{display:block;margin-bottom:4px}.filters{padding:14px;gap:10px}.filters input{width:100%;flex:auto;min-width:0}.filters label{flex:1 1 calc(50% - 10px)}.filters label select{width:100%;margin:4px 0 0}.filters>button{flex:1;font-size:12px}.row.head{display:none}.row{grid-template-columns:1fr auto;gap:12px;padding:18px}.row .account{grid-column:1}.row .role{grid-column:2;grid-row:1}.row .state{grid-column:1}.row .actions{grid-column:2}.row .date{display:none}.facts{gap:15px}.pager{align-items:start;flex-direction:column}.note{margin-top:15px}dialog{padding:22px}.dialog-head h2{font-size:20px}}
</style></head><body><div class="shell"><aside class="side"><a class="brand" href="http://127.0.0.1:4174/admin"><span class="mark">L</span>Lingua Loop</a><p class="caption">数据管理后台</p><nav aria-label="管理导航"><a href="http://127.0.0.1:4174/admin">数据管理</a><a href="http://127.0.0.1:4174/admin/articles">文章管理</a><a href="http://127.0.0.1:4174/admin/practice">专项题组</a><a href="http://127.0.0.1:4174/admin/practice/papers">整卷管理</a><a href="http://127.0.0.1:4174/admin/wall">留言管理</a><a class="active" aria-current="page" href="#">用户管理</a><a href="http://127.0.0.1:4174/admin/account">账户设置</a></nav><footer>Lingua Loop / 管理端</footer></aside><main><div class="crumb">Lingua Loop / 管理端 / 用户管理</div><header class="heading"><div><h1>用户管理</h1><p class="muted">查找学习账号，查看账号资料，管理启用状态与操作记录。</p></div><button id="audit">操作记录</button></header><div class="demo"><strong>独立交互原型</strong><span>以下均为虚构账号，操作只在本页演示，刷新重置。不会停用真实账号。</span></div><form class="filters" id="filters"><label class="sr" for="search">搜索账号、昵称或ID</label><input id="search" placeholder="搜索账号、昵称或 ID"><label>状态<select id="state"><option value="ALL">全部状态</option><option value="true">正常</option><option value="false">已停用</option></select></label><label>角色<select id="role"><option value="ALL">全部角色</option><option value="USER">学习者</option><option value="ADMIN">管理员</option></select></label><button class="primary">搜索</button><button type="button" id="clear">清空筛选</button></form><div class="summary"><span id="count"></span><span>账号资料 · 管理员可见</span></div><section class="list" aria-label="用户列表" id="list"></section><div class="pager"><span>停用保留学习与留言记录，不删除内容。</span><div><button id="prev">上一页</button><span id="pages"></span><button id="next">下一页</button></div></div><p class="note">密码采用不可逆哈希保存。管理端不显示密码或哈希。用户可通过登录页“忘记密码”自行验证邮箱并重置。</p></main></div>
<dialog id="detail" aria-labelledby="detailTitle"><header class="dialog-head"><div><h2 id="detailTitle">账号详情</h2><p class="muted">资料与操作记录</p></div><button class="close" data-close="detail" aria-label="关闭账号详情">×</button></header><div id="facts" class="facts"></div><p class="explain" id="accountHelp"></p><div class="dialog-actions" id="detailActions"></div><h3>管理记录</h3><div id="history"></div></dialog>
<dialog id="command" aria-labelledby="commandTitle"><form id="commandForm"><header class="dialog-head"><h2 id="commandTitle"></h2><button class="close" type="button" data-close="command" aria-label="关闭操作确认">×</button></header><p id="target"></p><p class="explain" id="impact"></p><label for="reason">操作原因（必填，仅管理员可见）</label><textarea id="reason" class="reason" maxlength="200" placeholder="简要说明此次操作的原因"></textarea><p id="error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="command">取消</button><button class="primary" id="confirm">确认</button></div></form></dialog>
<dialog id="auditDialog" aria-labelledby="auditTitle"><header class="dialog-head"><div><h2 id="auditTitle">操作记录</h2><p class="muted">演示记录 · 不包含密码或验证码</p></div><button class="close" data-close="auditDialog" aria-label="关闭操作记录">×</button></header><div id="allHistory"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);const users=[{id:'1001',username:'site_admin',name:'站长',admin:true,enabled:true,verified:true,joined:'2026-09-01',mail:'st***@example.test'},{id:'1002',username:'lin_reader',name:'林同学',enabled:true,verified:true,joined:'2026-10-03',mail:'li***@example.test'},{id:'1003',username:'morning_loop',name:'清晨十分钟',enabled:true,verified:true,joined:'2026-10-08',mail:'mo***@example.test'},{id:'1004',username:'new_learner',name:'新同学',enabled:true,verified:false,joined:'2026-10-12',mail:'未绑定'},{id:'1005',username:'summer_notes',name:'夏日笔记',enabled:false,verified:true,joined:'2026-10-14',mail:'su***@example.test'},{id:'1006',username:'quiet_steps',name:'慢慢来',enabled:true,verified:true,joined:'2026-10-19',mail:'qu***@example.test'}];let query='',state='ALL',role='ALL',page=1,selected=null,logs=[{id:'1005',name:'summer_notes',action:'停用账号',reason:'演示：用户申请暂停账号',time:'2026/10/26 15:20',actor:'site_admin'}],toastTimer;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function filtered(){return users.filter(u=>(!query||[u.id,u.username,u.name].some(s=>s.toLowerCase().includes(query.toLowerCase())))&&(state==='ALL'||String(u.enabled)===state)&&(role==='ALL'||(u.admin?'ADMIN':'USER')===role))}function status(u){return '<span class="badge '+(u.enabled?'ok':'off')+'">'+(u.enabled?'正常':'已停用')+'</span>'}function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/4));page=Math.min(page,pages);$('count').textContent='匹配 '+rows.length+' 个账号';$('pages').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('list').innerHTML='<div class="row head"><span>账号 / 昵称</span><span>角色</span><span>状态</span><span class="date">注册时间</span><span>操作</span></div>'+rows.slice((page-1)*4,page*4).map(u=>'<article class="row" data-id="'+u.id+'"><div class="account"><strong>'+escape(u.username)+'</strong><small>'+escape(u.name)+' · ID '+u.id+'</small></div><div class="role"><span class="badge">'+(u.admin?'管理员':'学习者')+'</span></div><div class="state">'+status(u)+'</div><span class="date">'+u.joined+'</span><div class="actions"><button data-detail="'+u.id+'">详情</button><button '+(u.admin?'disabled title="管理员账号受保护"':'data-change="'+u.id+'"')+' class="'+(u.enabled?'danger':'')+'">'+(u.admin?'受保护':u.enabled?'停用':'恢复')+'</button></div></article>').join('')+(rows.length?'':'<div class="empty">没有找到匹配的账号，试试其他条件。</div>')}
function history(items){return items.length?items.map(l=>'<article class="audit"><strong>'+escape(l.action)+' · '+escape(l.name)+'</strong><p>'+escape(l.reason)+'</p><small>'+escape(l.actor)+' · '+escape(l.time)+'</small></article>').join(''):'<p class="muted">暂无管理记录。</p>'}function detail(id){selected=users.find(u=>u.id===id);const u=selected;$('facts').innerHTML=[['账号',u.username],['昵称',u.name],['用户 ID',u.id],['角色',u.admin?'管理员（受保护）':'学习者'],['账号状态',u.enabled?'正常':'已停用'],['注册时间',u.joined],['邮箱',u.mail],['邮箱验证',u.verified?'已验证':'尚未验证']].map(([k,v])=>'<div><small>'+k+'</small><span>'+escape(v)+'</span></div>').join('');$('accountHelp').textContent=u.admin?'管理员账号受保护，本模块只提供查看。':'停用会限制登录与需要登录的操作，学习和留言记录保留。密码问题由用户在登录页自行验证邮箱重置。';$('detailActions').innerHTML='<button id="statusAction" '+(u.admin?'disabled':'')+'>'+(u.enabled?'停用账号':'恢复账号')+'</button>';$('history').innerHTML=history(logs.filter(l=>l.id===u.id));$('detail').showModal()}
function begin(){if(!selected||selected.admin)return;$('detail').close();$('commandTitle').textContent=selected.enabled?'停用账号':'恢复账号';$('target').textContent=selected.username+' · '+selected.name+' · ID '+selected.id;$('impact').textContent=selected.enabled?'正式版停用后会阻止登录并撤销既有会话，无法保存练习、提交作答、使用AI批改、发留言、点赞或评论。学习与留言记录保留，不自动隐藏已发布内容；仍可像访客一样浏览公开页面。':'正式版恢复后可重新登录继续学习；以前被撤销的会话不会重新生效。';$('reason').value='';$('error').textContent='';$('confirm').textContent='确认'+(selected.enabled?'停用':'恢复');$('command').showModal()}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}
$('filters').addEventListener('submit',e=>{e.preventDefault();query=$('search').value.trim();state=$('state').value;role=$('role').value;page=1;render()});$('clear').onclick=()=>{$('filters').reset();query='';state=role='ALL';page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('list').onclick=e=>{const target=e.target.closest('button');if(target?.dataset.detail)detail(target.dataset.detail);if(target?.dataset.change){selected=users.find(u=>u.id===target.dataset.change);begin()}};$('detailActions').onclick=e=>{if(e.target.id==='statusAction')begin()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('commandForm').onsubmit=e=>{e.preventDefault();const reason=$('reason').value.trim();if(!reason){$('error').textContent='请填写操作原因。';$('reason').focus();return}if(selected.admin)return;const label=selected.enabled?'停用账号':'恢复账号';selected.enabled=!selected.enabled;logs.unshift({id:selected.id,name:selected.username,action:label,reason,time:new Date().toLocaleString('zh-CN'),actor:'site_admin'});$('command').close();render();toast('账号状态已在本页更新（演示）。')};$('audit').onclick=()=>{$('allHistory').innerHTML=history(logs);$('auditDialog').showModal()};render();if(innerWidth<=700){const nav=document.querySelector('.side nav'),active=nav.querySelector('.active');nav.scrollLeft=active.offsetLeft-nav.offsetLeft-nav.clientWidth/2+active.clientWidth/2}
</script></body></html>
