<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lingua Loop 阶段 0 独立界面原型。页面效果待确认；不连接后端或使用演示学习数据。">
<title>界面原型 · Lingua Loop</title>
<style>:root {
  --bg:#f7f7f8; --surface:#fff; --surface-2:#fafafb; --surface-3:#f1f1f3;
  --line:#e9e9ec; --line-strong:#d7d7dd;
  --ink:#16171a; --ink-soft:#43464c; --muted:#6f747c;
  --accent:#c0324f; --accent-dark:#9d2740; --accent-soft:#f8e5ea;
  --accent-blur:rgba(224,122,152,.16);
  --ok:#128a55; --ok-soft:#e3f4ea; --warn:#9a6a12; --warn-soft:#fbf0d8;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(20,21,24,.04),0 6px 16px rgba(20,21,24,.04);
  --sans:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC",serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px;
}
*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg);font-family:var(--sans);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(650px 350px at 85% 0,var(--accent-blur),transparent 75%)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:wait}button,a{-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.3}h2{font-size:20px;letter-spacing:-.02em}h3{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--r-sm)}
[hidden]{display:none!important}.skip-link{position:fixed;left:16px;top:-100px;z-index:100;padding:10px 16px;background:var(--ink);color:white;border-radius:var(--r-sm)}.skip-link:focus{top:8px}
.topbar{position:sticky;top:0;z-index:30;padding:18px 20px 0}.nav-shell{display:flex;align-items:center;gap:28px;width:fit-content;max-width:100%;margin:auto;padding:9px 10px 9px 18px;border:1px solid var(--line);border-radius:var(--r-pill);background:rgba(255,255,255,.9);backdrop-filter:blur(16px);box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.04em;white-space:nowrap}.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--ink);color:#fff;border-radius:9px;font-size:19px}
.learner-nav{display:flex;align-items:center;gap:3px}.nav-link{display:block;padding:8px 12px;border-radius:var(--r-pill);font-size:13px;white-space:nowrap;color:var(--ink-soft)}
.nav-link:hover{background:var(--surface-3)}.nav-link.router-link-exact-active,.nav-link.is-active{color:var(--accent-dark);background:var(--accent-soft);font-weight:600}
.nav-link.admin-link{border-left:1px solid var(--line);border-radius:0;padding-left:17px;margin-left:5px;color:var(--muted)}
.menu-toggle{display:none;border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:7px 14px;background:white}
.page-content{width:min(1080px,calc(100% - 48px));margin:0 auto;padding:54px 0 48px}.page-content:focus{outline:none}
.home-intro{max-width:760px;margin:0 auto;text-align:center;padding:4px 0 36px}.home-wordmark{margin-bottom:14px;font-size:30px;font-weight:700;letter-spacing:-.045em}
.home-intro h1{text-wrap:balance;font-size:clamp(26px,3.2vw,38px);letter-spacing:-.045em;margin-bottom:16px}.home-intro .intro-copy{max-width:580px;margin:0 auto 20px;color:var(--muted);font-size:15px}
.phase-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--ink-soft);background:var(--surface);font-size:12px}
.phase-dot{width:6px;height:6px;background:var(--accent);border-radius:50%}
.entry-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 28px;border-bottom:1px solid var(--line)}.panel-heading h2{margin:0}.panel-heading p{margin:0;color:var(--muted);font-size:12px}
.entry-grid{display:grid;grid-template-columns:repeat(3,1fr)}.entry-item{padding:27px 28px 25px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;transition:background .15s}.entry-item:last-child{border-right:0}.entry-item:hover{background:var(--surface-2)}
.entry-glyph{display:inline-grid;place-items:center;width:44px;height:44px;margin-bottom:20px;border:1px solid var(--line);border-radius:var(--r-md);font-family:var(--serif);font-size:24px;font-weight:500;background:var(--surface-2)}
.entry-item h3{margin-bottom:8px}.entry-item p{margin-bottom:20px;color:var(--muted);min-height:46px;font-size:13px}.entry-meta{font-size:12px;color:var(--accent-dark);margin-top:auto}
.home-lower{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;margin-top:24px}.next-panel,.connection-panel{padding:25px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.next-panel h2,.connection-panel h2{font-size:17px;margin-bottom:14px}.next-panel p,.connection-panel>p{font-size:13px;color:var(--muted);margin-bottom:16px}
.next-list{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px}.next-list a{display:block;font-size:13px;padding:7px 13px;border:1px solid var(--line);border-radius:var(--r-sm)}.next-list a:hover{border-color:var(--line-strong);background:var(--surface-2)}
.study-hint{font-size:12px;color:var(--muted);margin:20px 4px 0}.site-footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:40px;font-size:12px;color:var(--muted)}
.pending-page{min-height:490px;display:flex;align-items:center;justify-content:center}.pending-sheet{width:min(100%,620px);text-align:center;padding:54px 40px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pending-symbol{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 24px;border-radius:var(--r-lg);background:var(--surface-3);font-size:28px;font-family:var(--serif);color:var(--ink-soft)}
.pending-sheet h1{font-size:28px;letter-spacing:-.03em;margin:18px 0 14px}.pending-sheet .pending-description{max-width:450px;margin:0 auto 25px;color:var(--muted);font-size:14px}.pending-state{display:inline-block;margin:0 0 14px;color:var(--accent-dark);font-size:13px}
.button-primary,.button-secondary{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:1px solid var(--ink);border-radius:var(--r-sm);font-size:13px;font-weight:600;background:var(--ink);color:#fff}.button-primary:hover{background:var(--ink-soft)}.button-secondary{border-color:var(--line-strong);background:white;color:var(--ink)}
.notfound-number{font-size:60px;font-weight:700;color:var(--line-strong);letter-spacing:-.07em;margin-bottom:10px}
.admin-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:var(--surface-2)}.admin-sidebar{padding:32px 24px;background:var(--surface);border-right:1px solid var(--line)}.admin-caption{margin:8px 0 34px;font-size:12px;color:var(--muted)}.admin-current{padding:11px 13px;background:var(--accent-soft);border-radius:var(--r-sm);color:var(--accent-dark);font-size:13px}.admin-return{display:inline-block;margin-top:24px;color:var(--ink-soft);font-size:13px}
.admin-content{padding:42px clamp(24px,5vw,72px);min-width:0}.admin-topline{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:34px;font-size:12px;color:var(--muted)}.admin-content h1{font-size:28px;margin-bottom:12px;letter-spacing:-.03em}.admin-description{max-width:650px;color:var(--muted)}.admin-empty{margin-top:30px;border:1px solid var(--line);border-radius:var(--r-md);background:white;padding:42px 24px;min-height:300px;text-align:center}
.admin-empty>p{color:var(--muted);font-size:13px}.empty-mark{margin:18px auto 22px;width:75px;height:64px;border:2px solid var(--line-strong);border-radius:var(--r-md);position:relative;background:var(--surface-2)}.empty-mark::before{content:"";position:absolute;inset:15px 14px auto;height:2px;background:var(--line-strong);box-shadow:0 10px var(--line-strong),0 20px var(--line-strong)}
.prototype-status{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;color:var(--muted);background:var(--surface-2)}
@media(max-width:960px){.nav-shell{width:min(100%,720px);position:relative;justify-content:space-between;padding:10px 14px 10px 17px}.menu-toggle{display:block}.learner-nav{display:none;position:absolute;top:calc(100% + 9px);left:0;right:0;padding:10px;background:white;box-shadow:var(--shadow-sm);border:1px solid var(--line);border-radius:var(--r-lg);grid-template-columns:1fr 1fr;gap:6px}.learner-nav.is-open{display:grid}.nav-link{padding:12px 14px;border-radius:var(--r-sm)}.nav-link.admin-link{border:0;border-top:1px solid var(--line);grid-column:1/-1;margin:3px 0 0;padding:12px 14px}.page-content{padding-top:40px}}
@media(max-width:600px){.topbar{padding:12px 16px 0}.page-content{width:calc(100% - 32px);padding-top:35px}.home-intro{padding-bottom:28px}.home-wordmark{font-size:27px}.home-intro .intro-copy{font-size:13px;max-width:320px}.home-intro h1{text-wrap:balance;font-size:26px;max-width:290px;margin:0 auto 14px}.panel-heading{padding:18px 20px;align-items:flex-start;flex-direction:column;gap:4px}.panel-heading h2{font-size:18px}.entry-grid{grid-template-columns:1fr}.entry-item{padding:20px;border:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr;column-gap:16px}.entry-item:last-child{border-bottom:0}.entry-glyph{grid-column:1;grid-row:1/4;margin:0}.entry-item h3{grid-column:2;margin-bottom:5px}.entry-item p{grid-column:2;min-height:0;margin-bottom:8px}.entry-meta{grid-column:2}.home-lower{grid-template-columns:1fr;gap:16px;margin-top:16px}.next-panel,.connection-panel{padding:22px 20px}.site-footer{margin-top:28px;flex-direction:column;gap:4px}.pending-page{min-height:440px}.pending-sheet{padding:38px 23px}.pending-sheet h1{font-size:25px}.admin-shell{grid-template-columns:1fr}.admin-sidebar{padding:18px 20px;border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.admin-caption{display:none}.admin-current{display:none}.admin-return{margin:0;font-size:12px}.admin-content{padding:28px 20px}.admin-content h1{font-size:25px}.admin-empty{padding:24px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
.entry-item:nth-child(2) .entry-glyph{font-size:17px}</style>
</head>
<body>
<!-- 独立单文件界面原型：无外部依赖，可直接双击打开。原型路由使用 hash，正式 Vue 工程使用 history。 -->
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="topbar" id="topbar"><div class="nav-shell">
<a class="brand" href="#/" aria-label="Lingua Loop 首页"><span class="brand-mark" aria-hidden="true">L</span>Lingua Loop</a>
<button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="learner-navigation" aria-label="打开导航">菜单</button>
<nav class="learner-nav" id="learner-navigation" aria-label="学习导航"><a class="nav-link" href="#/">首页</a><a class="nav-link" href="#/vocabulary">背单词</a><a class="nav-link" href="#/reading">外刊精读</a><a class="nav-link" href="#/practice">专项练习</a><a class="nav-link" href="#/stats">学习统计</a><a class="nav-link" href="#/login">登录</a><a class="nav-link admin-link" href="#/admin">管理端预览</a></nav>
</div></header>
<main id="main-content" class="page-content" tabindex="-1"></main>
<script>
const home = "<section class=\"home-intro\">\n  <p class=\"home-wordmark\">Lingua Loop</p>\n  <h1>把英语学习连成一个循环。</h1>\n  <p class=\"intro-copy\">从阅读中认识新词，在复习中记住它们，再把积累带回阅读与练习。</p>\n  <span class=\"phase-chip\"><span class=\"phase-dot\" aria-hidden=\"true\"></span>阶段 0 · 工程基础预览</span>\n</section>\n<section class=\"entry-panel\" aria-labelledby=\"entries-title\">\n  <div class=\"panel-heading\"><h2 id=\"entries-title\">学习入口</h2><p>先搭好入口，再逐步连接真实学习内容</p></div>\n  <div class=\"entry-grid\">\n    <a class=\"entry-item\" href=\"#/vocabulary\"><span class=\"entry-glyph\" aria-hidden=\"true\">Aa</span><h3>背单词</h3><p>把阅读中的生词带进学习与复习。</p><span class=\"entry-meta\">阶段 3 · 待开发</span></a>\n    <a class=\"entry-item\" href=\"#/reading\"><span class=\"entry-glyph\" aria-hidden=\"true\">Read</span><h3>外刊精读</h3><p>读文章、查词义，收藏值得记住的词。</p><span class=\"entry-meta\">阶段 2 · 待开发</span></a>\n    <a class=\"entry-item\" href=\"#/practice\"><span class=\"entry-glyph\" aria-hidden=\"true\">Q</span><h3>专项练习</h3><p>从四级阅读开始，检验理解与积累。</p><span class=\"entry-meta\">阶段 4 · 待开发</span></a>\n  </div>\n</section>\n<div class=\"home-lower\">\n  <section class=\"next-panel\"><h2>接下来，建立你的学习空间</h2><p>真实账号、阅读内容和复习记录将随各阶段逐步开放。</p><ul class=\"next-list\"><li><a href=\"#/login\">登录与账号</a></li><li><a href=\"#/stats\">学习统计</a></li><li><a href=\"#/admin\">管理端预览</a></li></ul></section>\n  <aside class=\"connection-panel\"><h2>开发连接状态</h2><p>这里只展示基础服务连接情况。</p><div class=\"prototype-status\">界面原型 · 未连接后端服务</div></aside>\n</div>\n<p class=\"study-hint\">当前页面为工程基础预览，学习内容、账号和学习记录尚未接入。</p>";
const admin = "<div class=\"admin-shell\"><aside class=\"admin-sidebar\"><a class=\"brand\" href=\"#/\" aria-label=\"Lingua Loop 首页\"><span class=\"brand-mark\" aria-hidden=\"true\">L</span>Lingua Loop</a><p class=\"admin-caption\">内容与学习资源管理</p><div class=\"admin-current\">布局预览</div><a class=\"admin-return\" href=\"#/\">返回学习端</a></aside><section class=\"admin-content\"><div class=\"admin-topline\">Lingua Loop / 管理端</div><h1>管理端布局预览</h1><p class=\"admin-description\">这里将用于维护文章、词书与题库。当前只预览布局，真实账号与访问权限将在阶段 1 加入。</p><section class=\"admin-empty\" aria-label=\"管理端空状态\"><div class=\"empty-mark\" aria-hidden=\"true\"></div><h2>管理功能尚未开放</h2><p>文章、词书和题库将随对应学习阶段接入。</p></section></section></div>";
const pages = {"/login":{"title":"登录与账号","stage":1,"description":"注册、登录与个人账户将在阶段 1 开放。当前尚未建立真实账号与登录会话。","glyph":"L"},"/vocabulary":{"title":"背单词","stage":3,"description":"词书、生词学习与间隔复习将在阶段 3 开放。阅读中的收藏词会成为学习与复习的起点。","glyph":"Aa"},"/reading":{"title":"外刊精读","stage":2,"description":"文章阅读、查词与生词收藏将在阶段 2 开放。当前尚未接入文章和词典内容。","glyph":"Read"},"/practice":{"title":"专项练习","stage":4,"description":"四级阅读题组、答题与解析将在阶段 4 开放。当前尚未接入题库与成绩记录。","glyph":"Q"},"/stats":{"title":"学习统计","stage":3,"description":"学习统计将在阶段 3 开放，届时由真实学习记录生成。当前没有可展示的学习数据。","glyph":"∑"}};
const main = document.getElementById('main-content');
const nav = document.getElementById('learner-navigation');
const toggle = document.getElementById('menu-toggle');
let open = false;
function setMenu(value) {
  open = value;
  nav.classList.toggle('is-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  toggle.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
  toggle.textContent = open ? '关闭' : '菜单';
}
toggle.addEventListener('click', () => setMenu(!open));
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && open) { setMenu(false); toggle.focus(); }
});
document.querySelector('.skip-link').addEventListener('click', event => { event.preventDefault(); main.focus(); });
nav.addEventListener('click', event => { if(event.target.closest('a')) setMenu(false); });
function render() {
  const path = location.hash.startsWith('#/') ? location.hash.slice(1) : '/';
  const page = pages[path];
  let content, title;
  if (path === '/') { content = home; title = '首页'; }
  else if (path === '/admin') { content = admin; title = '管理端布局预览'; }
  else if (page) {
    title = page.title;
    content = '<section class="pending-page"><div class="pending-sheet"><span class="pending-symbol" aria-hidden="true">'+page.glyph+'</span><span class="phase-chip">阶段 '+page.stage+'</span><h1>'+page.title+'</h1><p class="pending-state">待开发</p><p class="pending-description">'+page.description+'</p><a class="button-primary" href="#/">返回首页</a></div></section>';
  } else {
    title = '页面不存在';
    content = '<section class="pending-page"><div class="pending-sheet"><div class="notfound-number" aria-hidden="true">404</div><h1>页面不存在</h1><p class="pending-description">这个地址没有对应的页面。可以返回首页，查看现有入口。</p><a class="button-primary" href="#/">返回首页</a></div></section>';
  }
  document.getElementById('topbar').hidden = path === '/admin';
  main.className = path === '/admin' ? '' : 'page-content';
  main.innerHTML = content + (path === '/admin' ? '' : '<footer class="site-footer"><span>Lingua Loop · 一点积累，每天循环。</span><span>界面原型 · 待确认</span></footer>');
  for (const link of nav.querySelectorAll('a')) {
    const active = link.getAttribute('href') === '#'+path;
    link.classList.toggle('is-active', active);
    if(active) link.setAttribute('aria-current','page'); else link.removeAttribute('aria-current');
  }
  setMenu(false);
  document.title = title + ' · 界面原型 · Lingua Loop';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
